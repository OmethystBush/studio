<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定制工坊管家</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#746097; --primary2:#AD86AE; --pink:#ECD9ED; --cream:#EADACB;
  --bg:#FBF8FB; --text:#333; --text-light:#888; --gray:#B5B0BA;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif;}
body{background:var(--bg);color:var(--text);padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;}

/* ===== 底部导航 ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--pink);display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -2px 15px rgba(116,96,151,.1);z-index:100;
  border-top-left-radius:15px;border-top-right-radius:15px;
}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text-light);cursor:pointer;transition:.2s;padding:5px 12px;border-radius:14px;}
.nav-item.active{color:var(--primary);font-weight:bold;background:rgba(116,96,151,.12);}
.nav-item svg{width:22px;height:22px;margin-bottom:3px;fill:currentColor;}
.nav-dot{position:absolute;top:2px;right:6px;width:8px;height:8px;border-radius:50%;background:#F44336;display:none;}

.page{display:none;padding:15px;animation:fadeIn .2s;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.page-title{font-size:20px;font-weight:bold;margin-bottom:15px;padding-top:10px;color:var(--primary);}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px;}
.btn:active{opacity:.8;}
.btn-sm{padding:6px 10px;font-size:12px;width:auto;margin-top:0;border-radius:6px;display:inline-block;}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--pink);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:13px;color:var(--text-light);margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:1px solid var(--pink);border-radius:8px;font-size:14px;background:#fff;outline:none;}
.form-group textarea{resize:vertical;min-height:70px;}

/* ===== 排单 ===== */
.month-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;}
.month-tabs::-webkit-scrollbar{display:none;}
.month-pill{flex:0 0 auto;padding:6px 14px;border-radius:20px;background:#fff;border:1px solid var(--pink);font-size:13px;color:var(--text-light);cursor:pointer;}
.month-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:bold;}
.month-block{margin-bottom:18px;}
.month-head{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.month-head .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.month-head .name{font-size:15px;font-weight:bold;color:var(--primary);}

/* ===== 排单卡片 ===== */
.order-card{position:relative;border-radius:10px;padding:12px 12px 12px 14px;margin-bottom:10px;cursor:pointer;border-left:3px solid transparent;overflow:hidden;}
.order-card.bg-blue{background:var(--pink);border-left-color:var(--primary2);color:var(--text);}
.order-card.bg-purple{background:linear-gradient(135deg,var(--primary),var(--primary2));border-left-color:var(--primary);color:#fff;}
.order-card.bg-purple .oc-title,.order-card.bg-purple .oc-sub{color:#fff;}
.order-card.mine{background:var(--cream)!important;border-left-color:var(--primary)!important;color:var(--text)!important;}
.order-card.mine .oc-title,.order-card.mine .oc-sub{color:var(--text)!important;}
.order-card.done{background:#efedf1!important;border-left-color:var(--gray)!important;color:#999!important;opacity:.6;}
.order-card.done .oc-title,.order-card.done .oc-sub{color:#888!important;}
.oc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;}
.oc-badge{font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.25);}
.oc-mine-badge{position:absolute;top:8px;right:8px;font-size:11px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;}
.oc-title{font-size:15px;font-weight:bold;margin-bottom:4px;}
.oc-sub{font-size:12px;color:var(--text-light);}
.oc-dots{display:flex;gap:3px;margin-top:8px;align-items:center;font-size:11px;color:var(--text-light);}

/* ===== 时间线 ===== */
.timeline{position:relative;padding-left:22px;margin-top:8px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--pink);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--pink);z-index:2;}
.tl-item.done::before{background:var(--primary);border-color:var(--primary);}
.tl-item.current::before{background:var(--primary2);border-color:var(--primary2);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(173,134,174,.6)}70%{box-shadow:0 0 0 8px rgba(173,134,174,0)}100%{box-shadow:0 0 0 0 rgba(173,134,174,0)}}
.tl-name{font-size:14px;color:#888;}
.tl-item.done .tl-name{color:var(--primary);font-weight:bold;}
.tl-meta{font-size:11px;color:var(--text-light);margin-top:2px;}

/* ===== 聊天 ===== */
.chat-box{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0;}
.bubble{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;word-break:break-word;}
.bubble.admin{background:var(--primary);color:#fff;align-self:flex-start;border-bottom-left-radius:3px;}
.bubble.customer{background:var(--cream);color:var(--text);align-self:flex-end;border-bottom-right-radius:3px;}
.bubble.notice{background:var(--pink);color:var(--primary);align-self:stretch;max-width:100%;font-weight:bold;border-radius:8px;}
.chat-input{display:flex;gap:8px;margin-top:10px;}
.chat-input input{flex:1;padding:10px;border:1px solid var(--pink);border-radius:20px;font-size:14px;outline:none;}
.chat-input button{flex:0 0 auto;width:auto;padding:0 16px;margin:0;border-radius:20px;}

/* ===== 作品 ===== */
.filter-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:6px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-pill{flex:0 0 auto;padding:5px 14px;border-radius:16px;background:#fff;border:1px solid var(--pink);font-size:13px;color:var(--text-light);cursor:pointer;}
.filter-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pf-item{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;position:relative;}
.pf-item img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
.pf-info{padding:8px 10px;}
.pf-name{font-size:13px;color:var(--primary);font-weight:bold;}

/* ===== 后台 ===== */
.admin-tab{display:flex;background:#fff;border-radius:10px;padding:4px;margin-bottom:15px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.admin-tab div{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:8px;color:var(--text-light);cursor:pointer;}
.admin-tab div.active{background:var(--primary);color:#fff;font-weight:bold;}
.admin-section{display:none;}
.admin-section.active{display:block;}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;}
.dash div{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 2px 10px rgba(116,96,151,.06);}

/* ===== 上传与弹窗 ===== */
.upload-area{border:2px dashed var(--primary2);border-radius:8px;padding:16px;text-align:center;color:var(--primary);cursor:pointer;font-size:13px;}
.upload-area input{display:none;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-content{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px;animation:slideUp .3s;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.modal-header h3{color:var(--primary);font-size:18px;}
.modal-close{font-size:20px;color:#aaa;cursor:pointer;}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(116,96,151,.95);color:#fff;padding:12px 24px;border-radius:20px;font-size:13px;z-index:999;display:none;max-width:80%;text-align:center;}
</style>
</head>
<body>

<!-- 成品 -->
<div id="page-portfolio" class="page active">
  <div class="page-title">成品展示 ✨</div>
  <div class="filter-bar" id="pf-filters"></div>
  <div class="pf-grid" id="portfolio-container"></div>
</div>

<!-- 排单 -->
<div id="page-queue" class="page">
  <div class="page-title">排单进度 📋</div>
  <div id="queue-self-tip"></div>
  <div class="month-tabs" id="month-tabs"></div>
  <div id="queue-container"></div>
</div>

<!-- 申请 -->
<div id="page-apply" class="page">
  <div class="page-title">申请定制 ✉️</div>
  <div class="card">
    <form id="apply-form" onsubmit="submitApply(event)">
      <div class="form-group"><label>您的称呼 *</label><input type="text" id="app-name" required></div>
      <div class="form-group"><label>联系方式 *</label><input type="text" id="app-contact" required placeholder="手机号 / 微信号"></div>
      <div class="form-group"><label>想做什么 *</label><textarea id="app-desc" required placeholder="款式、用途、穿着场合…"></textarea></div>
      <div class="form-group"><label>预算范围</label>
        <select id="app-budget">
          <option value="500以下">500元以下</option>
          <option value="500-1000">500 - 1000元</option>
          <option value="1000-2000">1000 - 2000元</option>
          <option value="2000以上">2000元以上</option>
          <option value="不确定">不确定，想先聊聊</option>
        </select>
      </div>
      <div class="form-group"><label>期望交付时间</label>
        <select id="app-expected" onchange="document.getElementById('app-date-wrap').style.display = this.value==='date'?'block':'none'">
          <option value="不急">不急</option>
          <option value="1个月内">1个月内</option>
          <option value="date">有明确日期</option>
        </select>
      </div>
      <div class="form-group" id="app-date-wrap" style="display:none;"><input type="date" id="app-date"></div>
      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
        <label style="margin:0;">申请加急</label>
        <input type="checkbox" id="app-priority" style="width:auto;" onchange="if(this.checked)showToast('加急位名额有限，可能产生加急费')">
      </div>
      <div class="form-group">
        <label>参考图（可选，最多6张）</label>
        <div class="upload-area" onclick="document.getElementById('app-file').click()"><div id="app-upload-text">📷 点击上传参考图</div></div>
        <input type="file" id="app-file" accept="image/*" multiple onchange="document.getElementById('app-upload-text').innerText = '✅ 已选择 '+this.files.length+' 张图'">
      </div>
      <div class="form-group"><label>特殊要求</label><input type="text" id="app-special" placeholder="如：领口要小立领"></div>
      <button type="submit" class="btn" id="submit-btn">提交申请</button>
    </form>
  </div>
</div>

<!-- 我的订单 -->
<div id="page-my-orders" class="page">
  <div class="page-title">我的订单 📦</div>
  <div id="my-order-list"></div>
  <div id="order-detail-view" style="display:none;"></div>
</div>

<!-- 账户 -->
<div id="page-account" class="page">
  <div class="page-title">我的账户 👤</div>
  <div id="login-view" class="card">
    <h3 style="text-align:center;margin-bottom:20px;color:var(--primary);">登录</h3>
    <div class="form-group"><input type="text" id="login-phone" placeholder="手机号"></div>
    <div class="form-group"><input type="password" id="login-pwd" placeholder="密码"></div>
    <button class="btn" onclick="handleLogin()">登录</button>
    <button class="btn btn-ghost" onclick="showRegister()">注册新账号</button>
  </div>

  <div id="register-view" class="card" style="display:none;">
    <h3 style="text-align:center;margin-bottom:20px;color:var(--primary);">注册</h3>
    <div class="form-group"><input type="text" id="reg-phone" placeholder="手机号"></div>
    <div class="form-group"><input type="text" id="reg-nick" placeholder="昵称"></div>
    <div class="form-group"><input type="password" id="reg-pwd" placeholder="密码（≥6位）"></div>
    <button class="btn" onclick="handleRegister()">注册</button>
    <button class="btn btn-ghost" onclick="showLogin()">返回登录</button>
  </div>

  <div id="account-view" style="display:none;">
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="avatar" style="width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;">客</div>
        <div>
          <h3 id="account-name" style="color:var(--primary);">用户</h3>
          <div id="account-phone" style="font-size:12px;color:var(--text-light);"></div>
        </div>
      </div>
    </div>
    <div id="admin-entry" style="display:none;">
      <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;cursor:pointer;" onclick="switchTab('admin')">
        <b>⚙️ 进入后台管理 →</b>
      </div>
    </div>
    <div class="card">
      <button class="btn" style="background:#fff;color:#F44336;border:1px solid var(--pink);" onclick="handleLogout()">退出登录</button>
    </div>
  </div>
</div>

<!-- 后台 -->
<div id="page-admin" class="page">
  <div class="page-title">店长工作台 ⚙️</div>
  <div class="dash" id="admin-dash"></div>
  <div class="admin-tab">
    <div id="tab-apply" class="active" onclick="switchAdminTab('apply')">待审核</div>
    <div id="tab-manage" onclick="switchAdminTab('manage')">排单管理</div>
    <div id="tab-port" onclick="switchAdminTab('port')">作品</div>
  </div>
  
  <div id="admin-apply" class="admin-section active"><div id="apply-list-container">加载中...</div></div>
  <div id="admin-manage" class="admin-section"><div id="manage-list-container">加载中...</div></div>
  <div id="admin-port" class="admin-section">
    <div class="card">
      <h4 style="margin-bottom:10px;color:var(--primary);">发布新作品</h4>
      <div class="form-group"><label>作品名称</label><input type="text" id="port-title"></div>
      <div class="form-group"><label>描述</label><textarea id="port-desc"></textarea></div>
      <div class="form-group">
        <label>封面图</label>
        <div class="upload-area" onclick="document.getElementById('port-file').click()"><div id="port-upload-text">📷 点击选择封面图</div></div>
        <input type="file" id="port-file" accept="image/*" onchange="document.getElementById('port-upload-text').innerText = '✅ 已选择封面'">
      </div>
      <button class="btn" onclick="publishPortfolio()">发布</button>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="portfolio" onclick="switchTab('portfolio')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>成品</div>
  <div class="nav-item" data-tab="queue" onclick="switchTab('queue')"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>排单</div>
  <div class="nav-item" data-tab="apply" onclick="switchTab('apply')"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>申请</div>
  <div class="nav-item" data-tab="my-orders" onclick="switchTab('my-orders')"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>订单</div>
  <div class="nav-item" data-tab="account" onclick="switchTab('account')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>我的</div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://lvbxdtpjondnttzxiqxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_a9GY13wrjtGVroA6NPpvTA_Qv3bulQ_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=$('toast'); t.innerText=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2500); }
function fmtDate(d){ if(!d) return ''; const x = new Date(d); if(isNaN(x)) return d; return `${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; }
function monthKey(date=new Date()){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(mk){ const [y,m]=mk.split('-'); return `${y}年${parseInt(m)}月`; }

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const page = $('page-'+tab); if(page) page.classList.add('active');
  const nav = document.querySelector(`.nav-item[data-tab="${tab}"]`); if(nav) nav.classList.add('active');

  if(tab==='portfolio') loadPortfolio();
  if(tab==='queue') loadQueue();
  if(tab==='my-orders') loadMyOrders();
  if(tab==='account') renderAccount();
  if(tab==='admin'){ 
    if(!me?.is_admin){ showToast('仅店长可进入'); return switchTab('account'); }
    loadAdminAll(); 
  }
  window.scrollTo(0,0);
}

function switchAdminTab(type){
  document.querySelectorAll('.admin-tab div').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(el=>el.classList.remove('active'));
  $('tab-'+type).classList.add('active');
  $('admin-'+type).classList.add('active');
}

function showRegister(){ $('login-view').style.display='none'; $('register-view').style.display='block'; }
function showLogin(){ $('register-view').style.display='none'; $('login-view').style.display='block'; }

async function handleLogin(){
  const phone = $('login-phone').value.trim();
  const pwd   = $('login-pwd').value;
  if(!phone || !pwd) return showToast('请输入手机号和密码');

  const email = phone + '@studio.local';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if(error) return showToast('登录失败：' + error.message);

  await loadMe(data.user.id);
  $('login-pwd').value='';
  showToast('登录成功');
  switchTab('account');
}

async function handleRegister(){
  const phone = $('reg-phone').value.trim();
  const nick  = $('reg-nick').value.trim();
  const pwd   = $('reg-pwd').value;

  if(!phone || !nick || !pwd) return showToast('请填完整');
  if(pwd.length<6) return showToast('密码至少6位');

  const email = phone + '@studio.local';
  const { data, error } = await sb.auth.signUp({ email, password: pwd });
  if(error) return showToast('注册失败：' + error.message);
  
  if(data.user) {
    await sb.from('profiles').insert([{ id: data.user.id, phone, nickname: nick, is_admin: false }]);
    await loadMe(data.user.id);
    showToast('注册成功，已登录');
    switchTab('account');
  }
}

async function handleLogout(){
  await sb.auth.signOut();
  me = null;
  renderAccount();
  switchTab('portfolio');
}

async function loadMe(uid){
  const { data, error } = await sb.from('profiles').select('*').eq('id', uid).single();
  if(error || !data){
    me = { id: uid, nickname:'用户', phone:'', is_admin:false };
  } else {
    me = data;
  }
}

function renderAccount(){
  const logged = !!me;
  $('login-view').style.display = logged ? 'none' : 'block';
  $('register-view').style.display = 'none';
  $('account-view').style.display = logged ? 'block' : 'none';
  if(!logged) return;

  $('account-name').innerText = me.nickname || '用户';
  $('account-phone').innerText = me.phone ? me.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2') : '';
  $('avatar').innerText = (me.nickname||'客')[0];
  $('admin-entry').style.display = me.is_admin ? 'block' : 'none';
}

let pfFilter = '全部';
async function loadPortfolio(){
  const { data } = await sb.from('portfolios').select('*').eq('is_hidden', false).order('created_at',{ascending:false});
  const list = data || [];
  const cats = ['全部', ...new Set(list.map(x=>x.category).filter(Boolean))];
  $('pf-filters').innerHTML = cats.map(c=>`<div class="filter-pill ${c===pfFilter?'active':''}" onclick="pfFilter='${esc(c)}';loadPortfolio()">${esc(c)}</div>`).join('');
  const shown = pfFilter==='全部' ? list : list.filter(x=>x.category===pfFilter);
  const box = $('portfolio-container');
  if(!shown.length){ box.innerHTML = `<div style="grid-column:span 2;text-align:center;color:#aaa;padding:20px;">暂无成品</div>`; return; }
  box.innerHTML = shown.map(p=>`
    <div class="pf-item" onclick="openPortfolio('${p.id}')">
      <img src="${esc(p.cover_image||'')}" alt="">
      <div class="pf-info">
        <div class="pf-name">${esc(p.title)}</div>
      </div>
    </div>`).join('');
}

async function openPortfolio(id){
  const { data:p } = await sb.from('portfolios').select('*').eq('id',id).single();
  if(!p) return showToast('作品不存在');
  $('modal-body').innerHTML = `
    <div class="modal-header"><h3>${esc(p.title)}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
    <img src="${esc(p.cover_image||'')}" style="width:100%;border-radius:12px;">
    <p style="font-size:13px;color:#555;margin-top:12px;">${esc(p.description||'')}</p>
  `;
  $('custom-modal').classList.add('show');
}
function closeModal(){ $('custom-modal').classList.remove('show'); }

async function loadQueue(){
  const { data: pub, error } = await sb.from('public_queue').select('*');
  if(error) { console.error('排单加载失败:', error); return; }
  
  const orders = pub || [];
  let myOrderIds = [];
  if(me){
    const { data:mine } = await sb.from('orders').select('id').eq('user_id', me.id);
    myOrderIds = (mine||[]).map(o=>o.id);
  }

  const groups = {};
  orders.forEach(o=>{
    const m = o.schedule_month || monthKey();
    (groups[m] = groups[m] || []).push(o);
  });
  const cur = monthKey();
  if(!groups[cur]) groups[cur] = [];
  const months = Object.keys(groups).sort();

  $('month-tabs').innerHTML = months.map(m=>{
    const isCur = m===cur;
    return `<div class="month-pill ${isCur?'active':''}" onclick="document.getElementById('mb-${m}').scrollIntoView({behavior:'smooth'})">${monthLabel(m)}</div>`;
  }).join('');

  let html = '';
  for(const m of months){
    const list = groups[m];
    const active = list.filter(o=>o.status!=='已完成');
    const done   = list.filter(o=>o.status==='已完成');

    html += `<div class="month-block" id="mb-${m}">
      <div class="month-head">
        <div class="row"><div class="name">${monthLabel(m)}</div></div>
      </div>`;

    active.forEach(o=>{
      const isMine = myOrderIds.includes(o.id);
      let cls = 'bg-blue';
      if(o.status==='制作中') cls='bg-purple';
      if(isMine) cls='mine';
      html += renderQueueCard(o, cls, isMine);
    });
    
    if(done.length){
       html += `<div style="font-size:12px;color:#bbb;text-align:center;margin:10px 0;">— 已完成 —</div>`;
       done.forEach(o=> html += renderQueueCard(o, 'done', false));
    }
    html += `</div>`;
  }
  $('queue-container').innerHTML = html;
}

function renderQueueCard(o, cls, isMine){
  const dateText = o.estimated_date ? `预计 ${esc(o.estimated_date)}` : (o.estimated_period ? `预计${esc(o.estimated_period)}` : '时间待定');
  return `<div class="order-card ${cls}" onclick="handleQueueClick('${o.id}', ${isMine})">
    ${isMine?'<div class="oc-mine-badge">⭐ 我的</div>':''}
    <div class="oc-head">
      <span>${esc(o.order_no)} ${o.is_priority?'⚡加急':''}</span>
      <span class="oc-badge">${esc(o.status)}</span>
    </div>
    <div class="oc-title">${esc(o.client_name)} · ${esc(o.project_name)}</div>
    <div class="oc-sub">📅 ${dateText}</div>
    <div class="oc-dots"><span>${o.done_count||0}/10 ${esc(o.current_node||'')}</span></div>
  </div>`;
}

async function handleQueueClick(orderId, isMine){
  if(me?.is_admin){ 
    switchTab('admin'); 
    setTimeout(()=>openOrderDetail(orderId,'admin'), 100); 
    return; 
  }
  if(isMine){ 
    switchTab('my-orders'); 
    setTimeout(()=>openOrderDetail(orderId,'customer'), 100); 
  }
  else showToast('仅可查看自己的订单哦');
}

async function openOrderDetail(orderId, role){
  try {
    $('my-order-list').style.display='none';
    const box = $('order-detail-view');
    box.style.display='block'; box.innerHTML='加载中…';

    const resO = await sb.from('orders').select('*').eq('id',orderId).single();
    if(resO.error) throw new Error('订单读取失败: ' + resO.error.message + ' (请检查 orders 表是否缺字段)');
    const o = resO.data;

    const resN = await sb.from('order_nodes').select('*').eq('order_id',orderId).order('node_index');
    const nodes = resN.data || [];

    const resM = await sb.from('materials').select('*').eq('order_id',orderId).order('sort_order');
    const mats = resM.data || [];

    const resMsg = await sb.from('messages').select('*').eq('order_id',orderId).order('created_at');
    const msgs = resMsg.data || [];

    const isAdmin = role==='admin' || me?.is_admin;
    
    const tl = nodes.map(n=>{
      let cls = n.status==='已完成' ? 'done' : (n.status==='已跳过' ? 'skip' : '');
      return `<div class="tl-item ${cls}">
        <div class="tl-name">${n.node_index}. ${esc(n.node_name)}</div>
        ${n.done_at?`<div class="tl-meta">✓ ${fmtDate(n.done_at)}</div>`:''}
      </div>`;
    }).join('');

    const matHtml = mats.map(m=>`
      <div class="mat-card">
        <div style="display:flex;justify-content:space-between;">
          <b>${esc(m.name)}</b><span>${esc(m.status||'待采购')}</span>
        </div>
        <div style="font-size:12px;color:#888;">${esc(m.spec||'')} ${esc(m.quantity||'')}${esc(m.unit||'')}</div>
      </div>
    `).join('');

    const chatHtml = msgs.map(m=>{
      if(m.is_notice) return `<div class="bubble notice">📢 ${esc(m.content)}</div>`;
      const cls = m.sender_role==='admin' ? 'admin' : 'customer';
      return `<div class="bubble ${cls}">${esc(m.content)}</div>`;
    }).join('');

    box.innerHTML = `
      <button class="btn btn-ghost" style="margin-bottom:12px;" onclick="closeOrderDetail()">← 返回</button>

      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <h3 style="color:var(--primary);">${esc(o.project_name)}</h3>
          <span style="font-weight:bold;color:var(--primary);">${esc(o.status)}</span>
        </div>
        <p style="font-size:13px;color:var(--text-light);margin-top:6px;">${esc(o.order_no)} · ${esc(o.client_name)}</p>
      </div>

      <div class="card">
        <h4 style="color:var(--primary);margin-bottom:8px;">🧵 定制流程</h4>
        <div class="timeline">${tl||'<div style="font-size:13px;color:#aaa;">暂无流程数据</div>'}</div>
      </div>

      <div class="card">
        <h4 style="color:var(--primary);margin-bottom:8px;">💬 沟通</h4>
        <div class="chat-box">${chatHtml||'<div style="text-align:center;color:#bbb;font-size:13px;padding:10px;">暂无消息</div>'}</div>
        <div class="chat-input">
          <input id="chat-input" placeholder="输入留言…">
          <button class="btn" onclick="sendMessage('${o.id}')">发送</button>
        </div>
      </div>

      ${isAdmin ? `
      <div class="card">
        <h4 style="color:var(--primary);margin-bottom:8px;">⚙️ 店长操作</h4>
        <button class="btn btn-ghost" onclick="quickStatus('${o.id}','制作中')">标记为制作中</button>
        <button class="btn btn-ghost" onclick="quickStatus('${o.id}','已完成')">标记为已完成</button>
      </div>` : ''}
    `;

  } catch(err) {
    console.error("详情页崩溃:", err);
    $('order-detail-view').innerHTML = `<div style="padding:20px;text-align:center;color:#F44336;">
      <b>加载失败</b><br><span style="font-size:12px;">${err.message}</span><br><br>
      <button class="btn" onclick="closeOrderDetail()">返回</button>
    </div>`;
  }
}

function closeOrderDetail(){
  $('order-detail-view').style.display='none';
  if(me?.is_admin){ loadAdminAll(); }
  else loadMyOrders();
}

async function sendMessage(orderId){
  const input = $('chat-input'); const content = input.value.trim(); if(!content) return;
  await sb.from('messages').insert([{ order_id:orderId, sender_id:me?.id, sender_role: me?.is_admin?'admin':'customer', content }]);
  input.value='';
  openOrderDetail(orderId, me?.is_admin?'admin':'customer');
}

async function quickStatus(id, status){
  await sb.from('orders').update({status}).eq('id',id);
  showToast('状态已更新'); closeOrderDetail();
}

async function loadMyOrders(){
  if(!me){ return; }
  $('my-order-list').style.display='block'; $('order-detail-view').style.display='none';

  const { data: orders } = await sb.from('orders').select('*').eq('user_id', me.id).order('created_at',{ascending:false});
  if(!orders || !orders.length){
    $('my-order-list').innerHTML = `<div class="card" style="text-align:center;color:#aaa;">暂无订单</div>`; return;
  }
  $('my-order-list').innerHTML = orders.map(o=>`
    <div class="card" onclick="openOrderDetail('${o.id}','customer')">
      <div style="display:flex;justify-content:space-between;">
        <b>${esc(o.project_name)}</b>
        <span style="color:var(--primary);font-weight:bold;">${esc(o.status)}</span>
      </div>
    </div>`).join('');
}

async function loadAdminAll(){
  $('admin-dash').innerHTML = `<div style="grid-column:span 3;text-align:center;">工作台已加载</div>`;
  loadAdminApplications();
  loadAdminOrders();
}

async function loadAdminApplications(){
  const { data } = await sb.from('applications').select('*').eq('status','待审核').order('created_at',{ascending:false});
  const box = $('apply-list-container');
  if(!data || !data.length){ box.innerHTML = '<div style="text-align:center;color:#aaa;">暂无申请</div>'; return; }
  box.innerHTML = data.map(a=>`
    <div class="card">
      <b>${esc(a.applicant_name)} (${esc(a.contact)})</b>
      <p style="font-size:13px;color:#555;margin:8px 0;">${esc(a.description)}</p>
      <button class="btn btn-sm" style="background:var(--primary);width:100%;" onclick="acceptApply('${a.id}')">接单</button>
    </div>`).join('');
}

async function acceptApply(appId){
  const { data:a } = await sb.from('applications').select('*').eq('id',appId).single();
  if(!a) return;
  
  const { data:ord, error } = await sb.from('orders').insert([{
    order_no: '#000' + (Date.now()%10000), 
    client_name: a.applicant_name, 
    contact: a.contact,
    user_id: a.user_id, 
    project_name: '新定制款', 
    status: '排队中',
    schedule_month: monthKey()
  }]).select().single();

  if(error){ showToast('建单失败：'+error.message); return; }

  const nodeDefs = ['拆件沟通','版型确认','布料选择','下单确认','面料预缩','打版裁片','缝制拼接','整烫定型','细节装饰','质检包装'];
  await sb.from('order_nodes').insert(nodeDefs.map((n,i)=>({
    order_id:ord.id, node_index:i+1, node_name:n, status:'待开始'
  })));
  
  await sb.from('applications').update({status:'已接单'}).eq('id',appId);
  showToast('接单成功');
  loadAdminAll();
}

async function loadAdminOrders(){
  const { data } = await sb.from('orders').select('*').order('created_at',{ascending:false});
  const box = $('manage-list-container');
  if(!data || !data.length){ box.innerHTML='<div style="text-align:center;color:#aaa;">暂无订单</div>'; return; }
  box.innerHTML = data.map(o=>`
    <div class="card">
      <b>${esc(o.order_no)} ${esc(o.client_name)}</b>
      <div style="font-size:12px;color:#888;">${esc(o.status)}</div>
      <button class="btn btn-sm" style="margin-top:8px; width:100%;" onclick="switchTab('admin'); setTimeout(()=>openOrderDetail('${o.id}','admin'), 100);">查看详情/编辑</button>
    </div>`).join('');
}

// 提交申请和发布作品（补齐缺失的函数）
async function submitApply(e){
  e.preventDefault();
  if(!me){ showToast('请先登录'); switchTab('account'); return; }
  const btn = $('submit-btn'); btn.disabled = true; btn.innerText='提交中…';
  try {
    const payload = {
      user_id: me.id,
      applicant_name: $('app-name').value,
      contact: $('app-contact').value,
      description: $('app-desc').value,
      budget_range: $('app-budget').value,
      status: '待审核'
    };
    const { error } = await sb.from('applications').insert([payload]);
    if(error) throw error;
    showToast('🎉 申请已提交');
    $('apply-form').reset();
  } catch(err) {
    showToast('提交失败：' + err.message);
  } finally {
    btn.disabled = false; btn.innerText='提交申请';
  }
}

async function publishPortfolio(){
  const title = $('port-title').value.trim();
  if(!title) return showToast('请填写作品名称');
  const { error } = await sb.from('portfolios').insert([{ title, description: $('port-desc').value }]);
  if(error) return showToast('发布失败：'+error.message);
  showToast('🎉 发布成功');
  $('port-title').value=''; $('port-desc').value='';
  switchTab('portfolio');
}

sb.auth.onAuthStateChange(async (event, session)=>{
  if(session?.user){ await loadMe(session.user.id); }
  else { me = null; }
  renderAccount();
});

window.addEventListener('DOMContentLoaded', async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session?.user) await loadMe(session.user.id);
  renderAccount();
  loadPortfolio();
  loadQueue();
});
</script>
