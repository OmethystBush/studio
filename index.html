<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定制工坊管家</title>
<style>
:root {
    --primary: #746097; --primary2: #AD86AE; --pink: #ECD9ED; --cream: #EADACB;
    --bg: #FBF8FB; --text: #333; --text-light: #888; --gray: #B5B0BA; --danger: #F44336;
    --highlight: #FFF3C4; --highlight-border: #E0B400;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: calc(70px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
.loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 15px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--pink); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--pink); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -2px 15px rgba(116,96,151,.1); z-index: 100; border-top-left-radius: 15px; border-top-right-radius: 15px;}
.nav-item { position: relative; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-light); cursor: pointer; padding: 5px 10px; border-radius: 14px; flex: 1; max-width: 80px;}
.nav-item.active { color: var(--primary); font-weight: bold; background: rgba(116,96,151,.12); }
.nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; fill: currentColor; }
.nav-dot { position: absolute; top: 2px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: none; }

.page { display: none; padding: 15px; animation: fadeIn .2s; }
.page.active { display: block; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.page-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; padding-top: 10px; color: var(--primary); }
.card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(116,96,151,.06); }
.card-click { cursor: pointer; }
.btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: .1s;}
.btn:active { opacity: .8; transform: scale(0.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: 6px 10px; font-size: 12px; width: auto; margin-top: 0; border-radius: 6px; display: inline-block; }
.btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--pink); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }

.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 13px; color: var(--text); font-weight: bold; margin-bottom: 8px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--pink); border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
.form-group textarea { resize: vertical; height: 80px; }
.form-group input:disabled { background: #f5f5f5; color: var(--text-light); }
.upload-box { border: 2px dashed var(--primary2); border-radius: 8px; padding: 15px; text-align: center; color: var(--primary); cursor: pointer; font-size: 13px; background: var(--bg); }
details { border: 1px solid var(--pink); border-radius: 8px; padding: 12px; background: #fff; margin-bottom: 15px;}
summary { font-size: 14px; color: var(--primary); font-weight: bold; cursor: pointer; outline: none; display: flex; justify-content: space-between; }
.size-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.size-field label { display: block; font-size: 12px; color: var(--text-light); font-weight: normal; margin-bottom: 4px; }
.size-field input { width: 100%; padding: 10px; border: 1px solid var(--pink); border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
.check-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--pink); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
.check-row input { transform: scale(1.3); }
.hint { font-size: 12px; color: #b07a2a; background: #fff8e6; border-radius: 6px; padding: 8px 10px; margin-bottom: 15px; display: none; }

.img-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.img-thumb { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--pink); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb .del { position: absolute; top: 0; right: 0; width: 18px; height: 18px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }
.img-thumb.add { display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--primary); background: var(--bg); border-style: dashed; cursor: pointer; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
.filter-pill { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--pink); font-size: 13px; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-item { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer; position: relative;}
.pf-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.pf-info { padding: 8px 10px; }
.pf-name { font-size: 13px; color: var(--primary); font-weight: bold; }
.pf-pin { position: absolute; top: 6px; left: 6px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 8px; }
.gallery-tabs { display: flex; gap: 10px; margin-top: 15px; border-bottom: 1px solid var(--pink); padding-bottom: 5px; }
.g-tab { font-size: 14px; color: var(--text-light); cursor: pointer; padding-bottom: 5px;}
.g-tab.active { color: var(--primary); font-weight: bold; border-bottom: 2px solid var(--primary); }
.gallery-content { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
.gallery-content img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; }

.self-tip { background: var(--cream); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; color: #6b5b3e; }
.month-tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
.month-pill { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--pink); font-size: 13px; color: var(--text-light); white-space: nowrap; cursor: pointer; }
.month-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }
.month-head { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.cap-line { font-size: 12px; color: var(--text-light); display: flex; justify-content: space-between; margin-bottom: 3px; }
.cap-bg { height: 6px; background: var(--pink); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.cap-fill { height: 100%; background: var(--primary); transition: width .3s; }
.cap-fill.full { background: var(--primary2); }

.order-card { position: relative; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 3px solid transparent; cursor: pointer; }
.order-card.bg-purple { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
.order-card.mine { background: var(--cream); border-left-color: var(--primary); }
.order-card.done { background: #efedf1; border-left-color: var(--gray); opacity: 0.6; }
.order-card.mine.done { opacity: 0.6; border-left-color: var(--gray); background: #efedf1; }
.mine-badge { position: absolute; top: 0; right: 0; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 0 10px 0 8px; }
.order-card.mine.done .mine-badge { background: var(--gray); }
.oc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
.oc-badge { padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,.25); }
.oc-priority { background: var(--danger); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 4px; font-size: 11px;}
.oc-title { font-size: 15px; font-weight: bold; }
.oc-dots { display: flex; gap: 3px; margin-top: 8px; align-items: center; font-size: 11px; }
.oc-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(116,96,151,.2); }
.oc-dot.on { background: var(--primary); }
.order-card.bg-purple .oc-dot { background: rgba(255,255,255,.4); }
.order-card.bg-purple .oc-dot.on { background: #fff; }

.timeline { position: relative; padding-left: 22px; margin-top: 8px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--pink); }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ''; position: absolute; left: -22px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--pink); z-index: 2; }
.tl-item.done::before { background: var(--primary); border-color: var(--primary); }
.tl-item.current::before { background: var(--primary2); border-color: var(--primary2); animation: pulse 1.4s infinite; }
.tl-item.skip::before { background: #fff; border-color: var(--gray); }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(173,134,174,.6)} 70%{box-shadow:0 0 0 8px rgba(173,134,174,0)} 100%{box-shadow:0 0 0 0 rgba(173,134,174,0)} }
.tl-name { font-size: 14px; color: #888; }
.tl-item.done .tl-name { color: var(--primary); font-weight: bold; }
.tl-item.current .tl-name { color: var(--primary2); font-weight: bold; }
.tl-item.skip .tl-name { text-decoration: line-through; color: #bbb; }
.tl-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.tl-photo { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; margin-top: 6px; margin-right: 6px; cursor: pointer; border: 1px solid var(--pink); }

.remark-box { background: var(--bg); border-radius: 8px; padding: 10px; margin-top: 10px; }
.remark-item { font-size: 13px; color: var(--text); margin-bottom: 6px; }
.remark-item span { color: var(--text-light); }
.lock-tip { font-size: 12px; color: var(--danger); margin-top: 8px; }

.mat-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--pink); }
.mat-imgs { display: flex; gap: 6px; margin-right: 10px; }
.mat-imgs img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; border: 1px solid var(--pink); cursor: pointer; }
.mat-imgs .tag { font-size: 9px; color: var(--text-light); text-align: center; }
.mat-info { flex: 1; }
.mat-name { font-size: 13px; font-weight: bold; }
.mat-spec { font-size: 11px; color: var(--text-light); }
.mat-status { font-size: 11px; padding: 1px 6px; border-radius: 6px; }
.mat-status.wait { background: #fff8e6; color: #b07a2a; }
.mat-status.ship { background: #e6f0ff; color: #2a6bb0; }
.mat-status.arrive { background: #e6f8e6; color: #2a8b3a; }
.mat-total { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); margin-top: 10px; font-size: 14px; }

.node-selector { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin-bottom: 8px; border-bottom: 1px solid var(--pink); }
.node-pill { padding: 5px 10px; border-radius: 14px; background: #fff; border: 1px solid var(--pink); font-size: 11px; color: var(--text-light); white-space: nowrap; cursor: pointer; position: relative; }
.node-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }
.node-pill .badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 9px; padding: 0 4px; border-radius: 6px; }

.chat-box { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 5px; background: var(--bg); border-radius: 8px; border: 1px solid var(--pink); }
.chat-msg { display: flex; flex-direction: column; max-width: 85%; position: relative; }
.chat-msg.admin { align-self: flex-end; align-items: flex-end; }
.chat-msg.customer { align-self: flex-start; align-items: flex-start; }
.chat-msg.notice { align-self: stretch; max-width: 100%; }
.bubble { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.bubble.admin { background: var(--primary); color: #fff; border-bottom-right-radius: 2px; }
.bubble.customer { background: var(--cream); color: var(--text); border-bottom-left-radius: 2px; }
.bubble.notice { background: var(--pink); color: var(--primary); font-weight: bold; border-radius: 6px; text-align: center; font-size: 12px; }
.bubble.highlighted { box-shadow: 0 0 0 2px var(--highlight-border); background: var(--highlight) !important; color: var(--text) !important; }
.bubble img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; cursor: pointer; }
.msg-actions { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; }
.msg-actions span { color: var(--text-light); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.msg-actions span.on { color: var(--highlight-border); font-weight: bold; }
.chat-input { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.chat-input input { flex: 1; padding: 10px 15px; border: 1px solid var(--pink); border-radius: 20px; font-size: 14px; outline: none; background: #fff;}
.btn-upload { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--pink); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex: 0 0 auto; }

.summary-box { background: linear-gradient(135deg, #FFF9E6, #FFF3C4); border: 1px solid var(--highlight-border); border-radius: 10px; padding: 12px; margin-top: 10px; }
.summary-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.summary-title b { font-size: 13px; color: #8a6d00; }
.summary-title .edit-btn { font-size: 11px; color: var(--primary); cursor: pointer; }
.summary-content { font-size: 12px; color: #6b5b3e; line-height: 1.6; white-space: pre-wrap; }
.summary-content .item { padding: 4px 0; border-bottom: 1px dashed rgba(224,180,0,.3); }
.summary-content .item:last-child { border-bottom: none; }
.summary-content .empty { color: var(--text-light); font-style: italic; }

.dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
.dash-card { background: #fff; border-radius: 10px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer; position: relative;}
.dash-card:active { transform: scale(0.95); }
.dash-num { font-size: 20px; font-weight: bold; color: var(--primary); }
.dash-num.red { color: var(--danger); }
.dash-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.dash-card .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

.admin-tab { display: flex; background: #fff; border-radius: 10px; padding: 4px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(116,96,151,.06); overflow-x: auto; }
.admin-tab div { flex: 1; text-align: center; padding: 8px; font-size: 13px; border-radius: 8px; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.admin-tab div.active { background: var(--primary); color: #fff; font-weight: bold; }
.admin-sec { display: none; }
.admin-sec.active { display: block; }

.order-item { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: relative; touch-action: pan-y; }
.order-item.bg-purple { background: linear-gradient(135deg, #f5f0f8, #e6ddec); }
.order-item.bg-yellow { background: var(--cream); border-left-color: #D4BEA5; }
.order-item.dragging { opacity: 0.5; transform: scale(0.98); box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 10; }
.order-item.longpress-active { background: var(--pink) !important; }
.order-item .unread-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.order-item .change-tag { position: absolute; top: 8px; right: 8px; background: var(--danger); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 6px; }
.drag-handle { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #ccc; cursor: grab; touch-action: none; }
.drag-handle::after { content: '≡'; font-size: 24px; }
.order-ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.order-ops button { font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--pink); background: #fff; color: var(--primary); cursor: pointer; }
.order-ops button:active { background: var(--pink); }

.apply-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.apply-tabs div { flex: 1; text-align: center; padding: 8px; font-size: 13px; border-radius: 8px; background: #fff; border: 1px solid var(--pink); color: var(--text-light); cursor: pointer; }
.apply-tabs div.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }

.apply-status { font-size: 12px; padding: 2px 8px; border-radius: 8px; }
.apply-status.pending { background: #fff8e6; color: #b07a2a; }
.apply-status.accepted { background: #e6f8e6; color: #2a8b3a; }
.apply-status.rejected { background: #ffe6e6; color: var(--danger); }
.reject-reason { font-size: 12px; color: var(--danger); margin-top: 6px; background: #fff5f5; padding: 8px; border-radius: 6px; }

.picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 250; display: none; align-items: flex-end; justify-content: center; }
.picker-overlay.show { display: flex; }
.picker-sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 15px 20px calc(20px + env(safe-area-inset-bottom)); animation: slideUp .25s; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.picker-header .cancel { color: var(--text-light); font-size: 14px; cursor: pointer; }
.picker-header .confirm { color: var(--primary); font-size: 14px; font-weight: bold; cursor: pointer; }
.picker-header h4 { color: var(--primary); font-size: 16px; }
.picker-wheel { display: flex; gap: 10px; height: 200px; }
.wheel-col { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; border-radius: 10px; background: var(--bg); padding: 80px 0; position: relative; }
.wheel-col::-webkit-scrollbar { display: none; }
.wheel-item { height: 40px; line-height: 40px; text-align: center; font-size: 16px; color: var(--text-light); scroll-snap-align: center; cursor: pointer; }
.wheel-item.selected { color: var(--primary); font-weight: bold; font-size: 18px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-content { background: var(--bg); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp .3s; max-height: 95vh; overflow-y: auto; touch-action: pan-y; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom:10px; border-bottom:1px solid var(--pink);}
.modal-header h3 { color: var(--primary); font-size: 18px; }
.modal-close { font-size: 20px; color: #aaa; cursor: pointer; }
.modal-drag-bar { width: 40px; height: 4px; background: var(--pink); border-radius: 2px; margin: 0 auto 12px; }

.pending-work { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fff8e6; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #b07a2a; }
.pending-work b { font-size: 13px; color: #6b5b3e; }

.album-drawer { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 300; display: none; flex-direction: column; }
.album-drawer.show { display: flex; }
.album-header { padding: 15px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.album-body { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.album-body img { max-width: 90%; max-height: 100%; object-fit: contain; }
.album-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: rgba(255,255,255,.2); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
.album-nav.left { left: 10px; } .album-nav.right { right: 10px; }
.album-caption { color: #fff; text-align: center; padding: 15px; font-size: 13px; }

.star-rating { display: flex; gap: 5px; font-size: 24px; color: #ddd; cursor: pointer; justify-content: center; margin: 10px 0; }
.star-rating span.active { color: #FFD700; }

#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(116,96,151,.95); color: #fff; padding: 12px 24px; border-radius: 20px; font-size: 13px; z-index: 999; display: none; text-align: center; max-width: 80%; }
</style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="color: var(--primary); font-size: 14px;">加载中…</div>
</div>

<div id="app" style="display:none;">

    <!-- 成品展示 -->
    <div id="page-portfolio" class="page active">
        <div class="page-title">成品展示 ✨</div>
        <div class="filter-bar" id="portfolio-filters"></div>
        <div class="pf-grid" id="portfolio-container"></div>
    </div>

    <!-- 排单 -->
    <div id="page-queue" class="page">

<script type="module">
/* ⚠️ 请填入你的 Supabase 配置 */
const SUPABASE_URL = 'https://你的项目ID.supabase.co'; // 替换成你的
const SUPABASE_ANON_KEY = '你的anon key'; // 替换成你的

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
    user: null, isLogin: false, isAdmin: false, isShareMode: false,
    currentMonth: null, currentChatNode: 0, currentOrderDetail: null,
    album: { list: [], idx: 0 }, monthData: {}, applications: [], orders: [], works: [], chat: {}, summary: {},
    images: { sketch: [], style: [], detail: [] }, realtimeChannel: null
};

function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2200); }
function closeModal() { document.getElementById('custom-modal').classList.remove('show'); }
function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('custom-modal').classList.add('show'); }
function maskPhone(p) { return p ? p.slice(0,3) + '****' + p.slice(7) : ''; }
function phoneToEmail(phone) { return phone + '@studio.local'; }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d); return `${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`; }
function monthLabel(key) { const [y, m] = key.split('-'); return `${y}年${parseInt(m)}月`; }
const NODE_NAMES = ['拆件沟通','版型确认','布料选择','下单确认','面料预缩','打版裁片','缝制拼接','整烫定型','细节装饰','质检包装','寄出/交付'];

/* ================= 认证与初始化 ================= */
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (session && !session.user.is_anonymous) {
        await loadProfile(session.user);
    } else {
        // 尝试匿名登录以获取公共权限
        const { error } = await sb.auth.signInAnonymously();
        if(error) console.log('匿名登录失败，请去Supabase开启Anonymous sign-ins');
    }
    await enterApp(); 
}

async function loadProfile(user) {
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (data) { state.user = data; state.isLogin = true; state.isAdmin = data.is_admin; }
}

function showLoginPage() { document.getElementById('login-page').style.display = 'block'; document.getElementById('app').style.display = 'none'; }

async function doLogin() {
    const phone = document.getElementById('login-phone').value.trim();
    const pwd = document.getElementById('login-pwd').value;
    if (!phone || pwd.length < 6) return showToast('请输入手机号和 ≥6 位密码');
    const btn = document.getElementById('login-btn'); btn.disabled = true; btn.innerText = '登录中…';
    const { data, error } = await sb.auth.signInWithPassword({ email: phoneToEmail(phone), password: pwd });
    btn.disabled = false; btn.innerText = '登录';
    if (error) return showToast('登录失败：' + error.message);
    await loadProfile(data.user);
    await enterApp();
}

function openRegisterModal() {
    openModal(`
        <div class="modal-drag-bar"></div>
        <div class="modal-header"><h3>注册</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>手机号</label><input id="reg-phone"></div>
        <div class="form-group"><label>昵称</label><input id="reg-nick"></div>
        <div class="form-group"><label>密码</label><input type="password" id="reg-pwd"></div>
        <button class="btn" onclick="submitRegister()">注册并登录</button>
    `);
}
async function submitRegister() {
    const phone = document.getElementById('reg-phone').value.trim();
    const nick = document.getElementById('reg-nick').value.trim();
    const p1 = document.getElementById('reg-pwd').value;
    if (!phone || !nick || p1.length < 6) return showToast('请完整填写');
    const { data, error } = await sb.auth.signUp({ email: phoneToEmail(phone), password: p1, options: { data: { phone, nickname: nick } } });
    if (error) return showToast('注册失败：' + error.message);
    await loadProfile(data.user);
    closeModal(); await enterApp();
}

async function doLogout() { await sb.auth.signOut(); location.reload(); }

async function enterApp() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('share-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderBottomNav();
    await loadAllData();
    renderAccount();
    switchTab('portfolio');
    document.getElementById('loading').style.display = 'none';
    if (state.isAdmin) setupRealtime();
}

/* ================= 数据加载 ================= */
async function loadAllData() {
    await Promise.all([loadMonths(), loadWorks(), loadOrders()]);
    if (state.isAdmin) await loadApplications();
    await buildChatFromOrders();
}
async function loadMonths() {
    const { data } = await sb.from('month_settings').select('*');
    const months = {};
    (data || []).forEach(s => months[s.month] = { normalLimit: s.normal_limit, priorityLimit: s.priority_limit, normalUsed: 0, priorityUsed: 0 });
    const now = new Date();
    for (let i = 0; i < 3; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if (!months[key]) months[key] = { normalLimit: 10, priorityLimit: 2, normalUsed: 0, priorityUsed: 0 };
    }
    const { data: orders } = await sb.from('orders').select('schedule_month,is_priority,status').in('status', ['排队中','制作中']);
    (orders || []).forEach(o => {
        if (months[o.schedule_month]) {
            if (o.is_priority) months[o.schedule_month].priorityUsed++; else months[o.schedule_month].normalUsed++;
        }
    });
    Object.keys(months).forEach(k => months[k].label = monthLabel(k));
    state.monthData = months;
    state.currentMonth = Object.keys(months).sort()[0];
}
async function loadWorks() {
    const { data } = await sb.from('portfolios').select('*').eq('is_hidden', false).order('is_pinned', { ascending: false }).order('sort_order');
    state.works = (data || []).map(w => ({ id: w.id, title: w.title, category: w.category, desc: w.description, cover: w.cover_image, images: w.detail_images || [], process: w.process, pinned: w.is_pinned }));
}
async function loadOrders() {
    let q = sb.from('orders').select('*').order('schedule_month', { ascending: true }).order('is_priority', { ascending: false }).order('sort_order');
    if (!state.isAdmin) q = q.eq('user_id', state.user?.id || '00000000-0000-0000-0000-000000000000');
    const { data } = await q;
    state.orders = (data || []).map(o => ({
        id: o.id, no: o.order_no, name: o.client_name, project: o.project_name, status: o.status, isPriority: o.is_priority, month: o.schedule_month,
        sortOrder: o.sort_order, estimatedDate: o.estimated_date, estimatedPeriod: o.estimated_period, remarkPattern: o.remark_pattern, remarkFabric: o.remark_fabric,
        remarkUnread: o.remark_unread, phone: o.contact, shareToken: o.share_token, mine: o.user_id === state.user?.id, nodeIndex: 0, totalNodes: 11, skipped: []
    }));
    if (state.orders.length) {
        const { data: nodes } = await sb.from('order_nodes').select('*').in('order_id', state.orders.map(o => o.id)).order('node_index');
        state.orders.forEach(o => {
            const ns = (nodes || []).filter(n => n.order_id === o.id);
            o.totalNodes = ns.length || 11;
            o.nodeIndex = ns.filter(n => n.status === '已完成').length;
            o.skipped = ns.filter(n => n.status === '已跳过').map(n => n.node_index);
            o.nodeNames = ns.map(n => n.node_name);
            o.nodePhotos = {};
            ns.forEach(n => { if (n.photos?.length) o.nodePhotos[n.node_index] = n.photos; });
        });
    }
}
async function loadApplications() {
    const { data } = await sb.from('applications').select('*').order('created_at', { ascending: false });
    state.applications = (data || []).map(a => ({ id: a.id, name: a.applicant_name, phone: a.contact, desc: a.description, budget: a.budget_range, priority: a.want_priority, status: a.status, reason: a.reject_reason, images: [...(a.images?.sketch||[]), ...(a.images?.style||[])], createdAt: fmtDate(a.created_at), raw: a }));
}
async function buildChatFromOrders() {
    if (!state.orders.length) return;
    const { data } = await sb.from('messages').select('*').in('order_id', state.orders.map(o => o.id)).order('created_at');
    state.chat = {};
    (data || []).forEach(m => {
        if (!state.chat[m.order_id]) state.chat[m.order_id] = {};
        if (!state.chat[m.order_id][m.node_index]) state.chat[m.order_id][m.node_index] = [];
        state.chat[m.order_id][m.node_index].push({ id: m.id, role: m.sender_role, text: m.content || (m.image_url ? `<img src="${m.image_url}">` : ''), highlighted: m.highlighted, publishable: m.publishable });
    });
    state.orders.forEach(o => { state.summary[o.id] = o.summary || {}; });
}

/* ================= 导航 ================= */

function switchTab(tabId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const page = document.getElementById('page-' + tabId);
    if (page) page.classList.add('active');
    const nav = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
    if (nav) nav.classList.add('active');
    
    if (tabId === 'portfolio') renderPortfolio();
    if (tabId === 'queue') renderQueue();
    if (tabId === 'apply') checkApplyLogin();
    if (tabId === 'my-orders') renderMyOrders();
    if (tabId === 'account') renderAccount();
    if (tabId === 'admin') renderAdmin();
    window.scrollTo(0, 0);
}

/* ================= 顾客端基础页 ================= */
function renderAccount() {
    const el = document.getElementById('account-content');
    if (!state.isLogin) {
        el.innerHTML = `<div class="card" style="text-align:center;">
            <p style="margin-bottom:15px; color:var(--text-light);">当前为游客浏览模式</p>

        </div>`;

    }
    el.innerHTML = `
        <div class="card">
            <h3 style="color:var(--primary);">${state.user.nickname}</h3>
            <p style="font-size:12px; color:var(--text-light); margin-top:5px;">${maskPhone(state.user.phone)} ${state.isAdmin ? '· 店长' : ''}</p>
        </div>
        <div class="card">
            <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
        </div>
    `;
}

function renderPortfolio(cat = '全部') {
    const cats = ['全部', ...new Set(state.works.map(w => w.category).filter(Boolean))];
    document.getElementById('portfolio-filters').innerHTML = cats.map(c => `<div class="filter-pill ${c === cat ? 'active' : ''}" onclick="renderPortfolio('${c}')">${c}</div>`).join('');
    const list = state.works.filter(w => cat === '全部' || w.category === cat);
    document.getElementById('portfolio-container').innerHTML = list.map(w => `
        <div class="pf-item" onclick="openPortfolio(${w.id})">
            ${w.pinned ? '<div class="pf-pin">精选</div>' : ''}
            <img src="${w.cover || ''}" alt="${w.title}">
            <div class="pf-info"><div class="pf-name">${w.title}</div></div>
        </div>
    `).join('') || '<p style="text-align:center; color:var(--text-light); padding:20px; grid-column:span 2;">暂无作品</p>';
}

function openPortfolio(id) {
    const w = state.works.find(x => x.id === id);
    if (!w) return;
    const hasProcess = w.process?.nodes?.length;
    openModal(`
        <div class="modal-drag-bar"></div>
        <div class="modal-header"><h3>${w.title}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <img src="${w.cover}" style="width:100%; border-radius:12px;">
        <p style="font-size:13px; color:var(--text-light); margin-top:10px;">${w.desc || ''}</p>
        <div class="gallery-tabs"><div class="g-tab active" onclick="switchGallery(this, 'g1')">作品展示</div></div>
        <div id="g1" class="gallery-content"><img src="${w.cover}" onclick="openAlbum([{url:'${w.cover}',caption:'作品'}],0)"></div>
        ${hasProcess ? `<div class="card" style="background:var(--bg); margin-top:20px; cursor:pointer;" onclick="openProcessReview(${w.id})"><b style="font-size:13px; color:var(--primary);">📖 制作过程回顾</b></div>` : ''}
        <button class="btn" onclick="closeModal(); switchTab('apply'); prefillFromWork('${w.title.replace(/'/g,"\\'")}');">✨ 同款定制</button>
    `);
}
function switchGallery(el, id) { el.parentElement.querySelectorAll('.g-tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); el.parentElement.querySelectorAll('.gallery-content').forEach(c => c.style.display = 'none'); document.getElementById(id).style.display = 'grid'; }
function prefillFromWork(title) { const d = document.getElementById('apply-desc'); if (d) d.value = `想参考作品《${title}》定做`; showToast('已带入参考'); }
function openProcessReview(workId) {
    const w = state.works.find(x => x.id === workId);
    if (!w?.process) return;
    const html = w.process.nodes.map((n, i) => `
        <div class="card" style="padding:10px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;"><b style="color:var(--primary);">${i+1}. ${n.name}</b><span>${n.status}</span></div>
            ${n.photos?.length ? `<div style="display:flex; gap:6px; margin-top:8px;">${n.photos.map(p => `<img src="${p.url}" style="width:60px; height:60px; border-radius:6px; object-fit:cover;">`).join('')}</div>` : ''}
            ${n.summary ? `<div style="background:#FFF9E6; padding:8px; border-radius:6px; font-size:12px; color:#8a6d00; margin-top:8px;">⭐ ${n.summary}</div>` : ''}
        </div>
    `).join('');
    openModal(`<div class="modal-drag-bar"></div><div class="modal-header"><h3>📖 制作过程回顾</h3><div class="modal-close" onclick="closeModal()">✕</div></div>${html}<button class="btn" onclick="closeModal(); openPortfolio(${workId})">返回</button>`);
}

function renderQueue() {
    const months = Object.keys(state.monthData).sort();
    document.getElementById('month-tabs').innerHTML = months.map(m => `<div class="month-pill ${m === state.currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${state.monthData[m].label}</div>`).join('');
    const md = state.monthData[state.currentMonth];
    if (!md) return;
    const nFull = md.normalUsed >= md.normalLimit;
    const pFull = md.priorityUsed >= md.priorityLimit;
    document.getElementById('month-head').innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <b style="color:var(--primary); font-size:15px;">${md.label} 排单容量</b>
            <span style="font-size:12px; color:${nFull ? 'var(--primary2)' : '#2a8b3a'};">${nFull ? '已满' : '未满'}</span>
        </div>
        <div class="cap-line"><span>订单位 ${md.normalUsed}/${md.normalLimit}</span><span>加急 ${md.priorityUsed}/${md.priorityLimit}</span></div>
        <div class="cap-bg"><div class="cap-fill ${nFull ? 'full' : ''}" style="width:${Math.min(100, md.normalUsed/md.normalLimit*100)}%"></div></div>
        <div class="cap-bg"><div class="cap-fill ${pFull ? 'full' : ''}" style="width:${Math.min(100, md.priorityUsed/md.priorityLimit*100)}%"></div></div>
    `;
    const list = state.orders.filter(o => o.month === state.currentMonth && o.status !== '已取消').sort((a, b) => {
        const aDone = a.status === '已完成', bDone = b.status === '已完成';
        if (aDone !== bDone) return aDone ? 1 : -1;
        if (a.isPriority !== b.isPriority) return a.isPriority ? -1 : 1;
        return a.sortOrder - b.sortOrder;
    });
    document.getElementById('queue-container').innerHTML = list.map(o => {
        const mine = o.mine;
        const done = o.status === '已完成';
        let cls = 'order-card';
        if (mine && done) cls += ' mine done';
        else if (mine) cls += ' mine';
        else if (done) cls += ' done';
        else if (o.status === '制作中') cls += ' bg-purple';
        const displayName = mine ? o.name : (o.name?.charAt(0) || '') + '**';
        return `
            <div class="${cls}" onclick="onQueueClick('${o.id}')">
                ${mine ? '<div class="mine-badge">⭐ 我的</div>' : ''}
                <div class="oc-head"><span>${o.no} ${o.isPriority ? '<span class="oc-priority">⚡加急</span>' : ''}</span><span class="oc-badge">${o.status}</span></div>
                <div class="oc-title">${displayName} · ${o.project}</div>
            </div>
        `;
    }).join('') || '<p style="text-align:center; color:var(--text-light); padding:20px;">本月暂无订单</p>';
    updateSelfTip();
}

function switchMonth(m) { state.currentMonth = m; renderQueue(); }
function updateSelfTip() {
    const tip = document.getElementById('self-tip');
    if (!tip) return;
    if (state.isAdmin || !state.isLogin) { tip.style.display = 'none'; return; }
    const mine = state.orders.find(o => o.mine && o.status !== '已完成' && o.month === state.currentMonth);
    if (!mine) { tip.style.display = 'none'; return; }
    tip.style.display = 'block';
    tip.innerHTML = `你的订单 <b>${mine.no}</b> 正在排队中`;
}
function onQueueClick(id) {
    if (state.isAdmin) { switchTab('admin'); switchAdminTab('orders'); setTimeout(() => openOrderDetail(id), 100); return; }
    const o = state.orders.find(x => x.id === id);
    if (!o) return;
    if (!o.mine) return showToast('仅可查看自己的订单哦');
    switchTab('my-orders');
    setTimeout(() => openCustomerOrderDetail(id), 100);
}

/* ================= 申请 ================= */
function checkApplyLogin() { 
    if (!state.isLogin) document.getElementById('login-hint').style.display = 'block'; 
    else {
        document.getElementById('login-hint').style.display = 'none';
        if (!document.getElementById('apply-name').value) document.getElementById('apply-name').value = state.user.nickname;
        if (!document.getElementById('apply-contact').value) document.getElementById('apply-contact').value = state.user.phone;
    }
}
function onPriorityChange(el) { document.getElementById('priority-hint').style.display = el.checked ? 'block' : 'none'; }
function addImages(kind, input) { Array.from(input.files || []).slice(0, 6 - state.images[kind].length).forEach(f => state.images[kind].push({ file: f, url: URL.createObjectURL(f) })); input.value = ''; renderImageRow(kind); }
function renderImageRow(kind) { document.getElementById('row-' + kind).innerHTML = state.images[kind].map((img, i) => `<div class="img-thumb"><img src="${img.url}"><div class="del" onclick="state.images['${kind}'].splice(${i},1);renderImageRow('${kind}')">✕</div></div>`).join(''); }
function useSizePreset() { showToast('预设尺寸已自动填入'); }

async function submitApply(e) {
    e.preventDefault();
    if (!state.isLogin) return showToast('请先登录再提交申请');
    const btn = document.getElementById('apply-submit-btn'); btn.disabled = true; btn.innerText = '提交中…';
    let sketch = [], style = [], detail = [];
    
    for (const img of state.images.sketch) { const { data } = await sb.storage.from('application-images').upload(`${state.user.id}/${Date.now()}_s`, img.file); if(data) sketch.push(sb.storage.from('application-images').getPublicUrl(data.path).data.publicUrl); }
    for (const img of state.images.style) { const { data } = await sb.storage.from('application-images').upload(`${state.user.id}/${Date.now()}_st`, img.file); if(data) style.push(sb.storage.from('application-images').getPublicUrl(data.path).data.publicUrl); }
    for (const img of state.images.detail) { const { data } = await sb.storage.from('application-images').upload(`${state.user.id}/${Date.now()}_d`, img.file); if(data) detail.push(sb.storage.from('application-images').getPublicUrl(data.path).data.publicUrl); }
    
    const { error } = await sb.from('applications').insert({
        user_id: state.user.id, applicant_name: document.getElementById('apply-name').value, contact: document.getElementById('apply-contact').value,
        description: document.getElementById('apply-desc').value, budget_range: document.getElementById('apply-budget').value,
        want_priority: document.getElementById('apply-priority').checked, images: { sketch, style, detail }, special_request: document.getElementById('apply-special').value, status: '待审核'
    });
    
    btn.disabled = false; btn.innerText = '提交申请';
    if (error) return showToast('提交失败');
    document.getElementById('apply-form-area').style.display = 'none'; document.getElementById('apply-success-area').style.display = 'block';
}

/* ================= 我的订单 ================= */
function renderMyOrders() {
    document.getElementById('my-order-list').style.display = 'block'; document.getElementById('order-detail-view').style.display = 'none';
    if (!state.isLogin) { document.getElementById('my-order-list').innerHTML = '<p style="text-align:center; padding:20px;">请先登录</p>'; return; }
    const list = state.orders.filter(o => o.mine);
    document.getElementById('my-order-list').innerHTML = list.map(o => `
        <div class="card card-click" onclick="openCustomerOrderDetail('${o.id}')">
            <div style="display:flex; justify-content:space-between;">
                <b>${o.project}</b>
                <span style="color:${o.status === '已完成' ? 'var(--gray)' : 'var(--primary)'}; font-weight:bold;">${o.status}</span>
            </div>
            <div style="font-size:12px; color:var(--text-light); margin-top:6px;">${o.no} · 当前节点：${o.nodeNames?.[o.nodeIndex] || '已完成'}</div>
        </div>
    `).join('') || '<p style="text-align:center; padding:20px;">暂无订单</p>';
}

function openCustomerOrderDetail(id) {
    const o = state.orders.find(x => x.id === id);
    state.currentOrderDetail = o; state.currentChatNode = Math.min(o.nodeIndex, o.totalNodes - 1);
    document.getElementById('my-order-list').style.display = 'none'; document.getElementById('my-apply-list').style.display = 'none';
    document.getElementById('order-detail-view').style.display = 'block';
    const isDone = o.status === '已完成';
    const tlHtml = renderTimeline(o);
    document.getElementById('order-detail-view').innerHTML = `
        <button class="btn btn-ghost" style="margin-bottom:12px;" onclick="renderMyOrders()">← 返回</button>
        <div class="card">
            <div style="display:flex;justify-content:space-between;">
                <h3 style="color:var(--primary);">${o.project}</h3>
                <span style="font-weight:bold;color:${isDone ? 'var(--gray)' : 'var(--primary)'};">${o.status}</span>
            </div>
            <div style="font-size:12px; color:var(--text-light); margin-top:6px;">${o.no}</div>
        </div>
        <div class="card">
            <h4 style="color:var(--primary);margin-bottom:8px;">🧵 定制流程</h4>
            <div class="timeline">${tlHtml}</div>
        </div>
        <div class="card" id="chat-card">
            <h4 style="color:var(--primary); margin-bottom:8px;">沟通记录 · 按节点</h4>
            <div class="node-selector" id="node-selector">${renderNodeTabs(o)}</div>
            <div id="chat-area">${renderChatArea(o)}</div>
        </div>
    `;
}

function renderTimeline(o) {
    const names = o.nodeNames || NODE_NAMES;
    return names.map((name, i) => {
        let cls = '';
        if (o.skipped.includes(i)) cls = 'skip';
        else if (i < o.nodeIndex) cls = 'done';
        else if (i === o.nodeIndex && o.status !== '已完成') cls = 'current';
        const photos = o.nodePhotos?.[i] || [];
        return `<div class="tl-item ${cls}">
            <div class="tl-name">${i + 1}. ${name} ${o.skipped.includes(i) ? '(本单无此工序)' : ''}</div>
            ${photos.length ? `<div>${photos.map(p => `<img class="tl-photo" src="${p.url}" onclick="openAlbum(${JSON.stringify(photos).replace(/"/g,'&quot;')},${photos.indexOf(p)})">`).join('')}</div>` : ''}
        </div>`;
    }).join('');
}
function renderNodeTabs(o) {
    const names = o.nodeNames || NODE_NAMES;
    return names.map((name, i) => `<div class="node-pill ${i === state.currentChatNode ? 'active' : ''}" onclick="switchChatNode('${o.id}', ${i})">${i + 1}. ${name}</div>`).join('');
}
function renderChatArea(o) {
    const msgs = state.chat[o.id]?.[state.currentChatNode] || [];
    const isDone = o.status === '已完成';
    const msgHtml = msgs.map(m => {
        if (m.role === 'notice' || m.isNotice) return `<div class="chat-msg notice"><div class="bubble notice">${m.text}</div></div>`;
        return `<div class="chat-msg ${m.role}"><div class="bubble ${m.role}">${m.text}</div></div>`;
    }).join('') || '<div style="text-align:center; color:var(--text-light); font-size:12px; padding:20px;">此节点暂无聊天记录</div>';
    return `
        <div class="chat-box" id="chat-box">${msgHtml}</div>
        <div class="chat-input">
            <input id="chat-input" placeholder="${isDone ? '订单已完成' : '输入留言…'}" ${isDone ? 'disabled' : ''}>
            <button class="btn btn-sm" style="margin:0;" onclick="sendCustomerMsg('${o.id}')" ${isDone ? 'disabled' : ''}>发送</button>
        </div>
    `;
}
function switchChatNode(orderId, nodeIdx) {
    state.currentChatNode = nodeIdx;
    const o = state.orders.find(x => x.id === orderId);
    if (!o) return;
    document.getElementById('node-selector').innerHTML = renderNodeTabs(o);
    document.getElementById('chat-area').innerHTML = renderChatArea(o);
}
async function sendCustomerMsg(orderId) {
    const input = document.getElementById('chat-input');
    if (!input || !input.value.trim() || input.disabled) return;
    const content = input.value;
    input.value = '';
    const { error } = await sb.from('messages').insert({
        order_id: parseInt(orderId), node_index: state.currentChatNode,
        sender_id: state.user.id, sender_role: 'customer', content
    });
    if (error) return showToast('发送失败');
    if (!state.chat[orderId]) state.chat[orderId] = {};
    if (!state.chat[orderId][state.currentChatNode]) state.chat[orderId][state.currentChatNode] = [];
    state.chat[orderId][state.currentChatNode].push({ role: 'customer', text: content });
    const o = state.orders.find(x => x.id === orderId);
    document.getElementById('chat-area').innerHTML = renderChatArea(o);
    const cb = document.getElementById('chat-box'); if (cb) cb.scrollTop = cb.scrollHeight;
}

            </div>
            <p style="font-size:13px; color:#555; margin-bottom:8px;">${a.desc}</p>
            ${a.images.length ? `<div class="img-row" style="margin-bottom:10px;">${a.images.map(u => `<div class="img-thumb"><img src="${u}" onclick="openAlbum([{url:'${u}',caption:'参考图'}],0)"></div>`).join('')}</div>` : ''}
            ${tab === 'pending' ? `
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-sm" style="flex:1;" onclick="openAcceptModal(${a.id})">接单</button>
                    <button class="btn btn-sm btn-danger" style="flex:1;" onclick="sb.from('applications').update({status:'已拒绝'}).eq('id',${a.id}).then(()=>renderAdmin())">拒绝</button>
                </div>
            ` : tab === 'rejected' ? `<div class="reject-reason">拒绝原因：${a.reason || '未填写'}</div>` : '<div style="font-size:12px; color:var(--primary);">已生成订单</div>'}
        </div>
    `).join('') : '<p style="text-align:center; padding:20px;">暂无数据</p>';
}

function openAcceptModal(id) {
    const app = state.applications.find(a => a.id === id);
    if (!app) return;
    const months = Object.keys(state.monthData).sort();
    const opts = months.map(m => `<option value="${m}" ${m === state.currentMonth ? 'selected' : ''}>${state.monthData[m].label}</option>`).join('');
    openModal(`
        <div class="modal-drag-bar"></div>
        <div class="modal-header"><h3>接单：${app.name}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>项目名称</label><input id="accept-project" value="${app.desc.slice(0,10)}"></div>
        <div class="form-group"><label>排入月份</label><select id="accept-month">${opts}</select></div>
        <button class="btn" onclick="confirmAccept(${id})">确认生成订单</button>
    `);
}
async function confirmAccept(id) {
    const app = state.applications.find(a => a.id === id);
    const project = document.getElementById('accept-project').value;
    const month = document.getElementById('accept-month').value;
    const { data: newOrder, error } = await sb.from('orders').insert({ user_id: app.raw.user_id, client_name: app.name, contact: app.phone, project_name: project, status: '排队中', schedule_month: month, is_priority: app.priority }).select().single();
    if (newOrder) {
        await sb.from('order_nodes').insert(NODE_NAMES.map((name, i) => ({ order_id: newOrder.id, node_index: i, node_name: name })));
        await sb.from('applications').update({ status: '已接单' }).eq('id', id);
        showToast('接单成功'); await loadAllData(); renderAdmin(); closeModal();
    }
}

function renderMake() {
    const months = Object.keys(state.monthData).sort();
    document.getElementById('make-month-tabs').innerHTML = months.map(m => `<div class="month-pill ${m === state.currentMonth ? 'active' : ''}" onclick="switchMonth('${m}'); renderMake()">${state.monthData[m].label}</div>`).join('');
    document.getElementById('make-month-title').innerText = (state.monthData[state.currentMonth]?.label || '') + ' 排单';
    const list = state.orders.filter(o => o.month === state.currentMonth).sort((a, b) => {
        const aDone = a.status === '已完成', bDone = b.status === '已完成';
        if (aDone !== bDone) return aDone ? 1 : -1;
        if (a.isPriority !== b.isPriority) return a.isPriority ? -1 : 1;
        return a.sortOrder - b.sortOrder;
    });
    const container = document.getElementById('drag-container');
    container.innerHTML = list.map(o => `
        <div class="order-item ${o.isPriority ? 'bg-yellow' : ''} ${o.status === '制作中' ? 'bg-purple' : ''}" data-id="${o.id}" data-sort="${o.sortOrder}">
            ${o.remarkUnread ? '<div class="change-tag">需求变更</div>' : ''}
            <div style="flex:1;" onclick="openOrderDetail('${o.id}')">
                <b>${o.no} ${o.name} ${o.isPriority ? '⚡' : ''}</b>
                <div style="font-size:12px; color:${o.status === '制作中' ? 'var(--primary)' : '#888'}; margin-top:4px;">${o.project} · ${o.status}</div>
                <div class="order-ops">
                    <button onclick="event.stopPropagation(); openStatusModal('${o.id}')">状态</button>
                </div>
            </div>
            <div class="drag-handle"></div>
        </div>
    `).join('') || '<p style="text-align:center; padding:20px;">本月暂无订单</p>';
    bindDragEvents();
}

function bindDragEvents() {
    const container = document.getElementById('drag-container');
    if (!container) return;
    let dragEl = null, startY = 0, startX = 0, timer = null, active = false;
    container.querySelectorAll('.order-item').forEach(item => {
        item.setAttribute('draggable', 'true');
        item.addEventListener('dragstart', () => { dragEl = item; setTimeout(() => item.classList.add('dragging'), 0); });
        item.addEventListener('dragend', () => { item.classList.remove('dragging'); dragEl = null; saveOrderFromDOM(); });
        item.addEventListener('touchstart', e => {
            const t = e.touches[0];
            startY = t.clientY; startX = t.clientX; dragEl = item;
            timer = setTimeout(() => { active = true; item.classList.add('dragging', 'longpress-active'); navigator.vibrate?.(30); }, 350);
        }, { passive: true });
        item.addEventListener('touchmove', e => {
            if (!active) {
                const t = e.touches[0];
                if (Math.abs(t.clientY - startY) > 8 || Math.abs(t.clientX - startX) > 8) clearTimeout(timer);
                return;
            }
            e.preventDefault();
            const y = e.touches[0].clientY;
            const after = getAfterEl(container, y);
            if (after == null) container.appendChild(dragEl);
            else container.insertBefore(dragEl, after);
        }, { passive: false });
        item.addEventListener('touchend', () => {
            clearTimeout(timer);
            if (active) { dragEl.classList.remove('dragging', 'longpress-active'); active = false; saveOrderFromDOM(); }
            dragEl = null;
        });
    });
    container.ondragover = e => {
        e.preventDefault();
        const dragging = container.querySelector('.dragging');
        if (!dragging) return;
        const after = getAfterEl(container, e.clientY);
        if (after == null) container.appendChild(dragging);
        else container.insertBefore(dragging, after);
    };
}
function getAfterEl(container, y) {
    return [...container.querySelectorAll('.order-item:not(.dragging)')].reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
    }, { offset: -Infinity }).element;
}
async function saveOrderFromDOM() {
    const items = [...document.querySelectorAll('#drag-container .order-item')];
    const updates = items.map((el, idx) => ({ id: parseInt(el.dataset.id), sort_order: idx + 1 }));
    for (const u of updates) { await sb.from('orders').update({ sort_order: u.sort_order }).eq('id', u.id); }
    showToast('排序已保存'); await loadOrders(); renderMake();
}

function openStatusModal(id) {
    const o = state.orders.find(x => x.id === id);
    openModal(`
        <div class="modal-drag-bar"></div>
        <div class="modal-header"><h3>切换状态：${o.no}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>订单状态</label>
            <select id="status-select">${['排队中','制作中','已完成','已取消'].map(s => `<option ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
        </div>
        <button class="btn" onclick="confirmStatus('${id}')">确认</button>
    `);
}
async function confirmStatus(id) {
    const s = document.getElementById('status-select').value;
    await sb.from('orders').update({ status: s }).eq('id', parseInt(id));
    closeModal(); showToast('已切换'); await loadOrders(); renderAdmin();
}

function renderOrderManageList() {
    const kw = (document.getElementById('order-search')?.value || '').trim();
    const sf = document.getElementById('order-status-filter')?.value || '';
    const list = state.orders.filter(o => {
        if (kw && !(o.no.includes(kw) || o.name.includes(kw) || (o.phone || '').includes(kw))) return false;
        if (sf && o.status !== sf) return false;
        return true;
    });
    document.getElementById('order-manage-list').innerHTML = list.map(o => `
        <div class="order-item" onclick="openOrderDetail('${o.id}')">
            <div style="flex:1;">
                <b>${o.no} ${o.name} ${o.isPriority ? '⚡' : ''}</b>
                <div style="font-size:12px; color:#888; margin-top:4px;">${o.project} · ${o.status}</div>
            </div>
        </div>
    `).join('') || '<p style="text-align:center; padding:20px;">无匹配</p>';
}

/* ================= 订单详情 (店长) ================= */
function openOrderDetail(id) {
    const o = state.orders.find(x => x.id === id);
    if (!o) return;
    state.currentOrderDetail = o; state.currentChatNode = Math.min(o.nodeIndex, o.totalNodes - 1);
    const tlHtml = renderTimeline(o);
    openModal(`
        <div class="modal-drag-bar"></div>
        <div class="modal-header"><h3>管理订单：${o.no}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="card">
            <h4 style="color:var(--primary); margin-bottom:8px;">🧵 流程管理</h4>
            <div class="timeline">${tlHtml}</div>
            <div class="order-ops" style="margin-top:10px;">
                ${(o.nodeNames || NODE_NAMES).map((name, i) => `<button onclick="openNodeAction('${id}', ${i})">${i + 1}. ${name.slice(0,4)}</button>`).join('')}
            </div>
        </div>
        <div class="card" id="chat-card">
            <h4 style="color:var(--primary); margin-bottom:8px;">沟通记录 · 按节点</h4>
            <div class="node-selector" id="node-selector">${renderAdminNodeTabs(o)}</div>
            <div id="chat-area">${renderAdminChatArea(o)}</div>
        </div>
    `);
}
function renderAdminNodeTabs(o) { return (o.nodeNames || NODE_NAMES).map((name, i) => `<div class="node-pill ${i === state.currentChatNode ? 'active' : ''}" onclick="switchChatNode('${o.id}', ${i})">${i + 1}. ${name}</div>`).join(''); }
function renderAdminChatArea(o) {
    const nodeIdx = state.currentChatNode;
    const msgs = state.chat[o.id]?.[nodeIdx] || [];
    const summaryText = state.summary[o.id]?.[nodeIdx] || '';
    const msgHtml = msgs.map((m, i) => {
        return `<div class="chat-msg ${m.role}">
            <div class="bubble ${m.role} ${m.highlighted ? 'highlighted' : ''}">${m.text}</div>
            <div class="msg-actions">
                <span class="${m.highlighted ? 'on' : ''}" onclick="toggleHighlight('${o.id}', ${nodeIdx}, ${i})">${m.highlighted ? '★ 已高亮' : '☆ 高亮'}</span>
                <span class="${m.publishable ? 'on' : ''}" onclick="togglePublishable('${o.id}', ${nodeIdx}, ${i})">${m.publishable ? '📖 公开' : '🔒 私密'}</span>
            </div>
        </div>`;
    }).join('') || '<div style="text-align:center; color:var(--text-light); font-size:12px; padding:20px;">此节点暂无记录</div>';
    return `
        <div class="chat-box" id="chat-box">${msgHtml}</div>
        <div class="chat-input">
            <input id="chat-input" placeholder="回复...">
            <button class="btn btn-sm" style="margin:0;" onclick="sendAdminMsg('${o.id}')">发送</button>
        </div>
        <div class="summary-box">
            <div class="summary-title"><b>⭐ 交流重点归纳</b><span class="edit-btn" onclick="editSummary('${o.id}', ${nodeIdx})">编辑</span></div>
            <div class="summary-content">${summaryText ? summaryText.split('\n').filter(x=>x.trim()).map(x=>`<div class="item">· ${x}</div>`).join('') : '<div class="empty">暂无，点消息「☆ 高亮」自动汇总</div>'}</div>
        </div>
    `;
}
async function toggleHighlight(orderId, nodeIdx, msgIdx) {
    const msgs = state.chat[orderId]?.[nodeIdx];
    if (!msgs || !msgs[msgIdx]) return;
    const m = msgs[msgIdx];
    m.highlighted = !m.highlighted;
    if (m.id) await sb.from('messages').update({ highlighted: m.highlighted }).eq('id', m.id);
    const cur = (state.summary[orderId]?.[nodeIdx] || '').split('\n').filter(x => x.trim());
    if (m.highlighted) { if (!cur.includes(m.text)) cur.push(m.text); }
    else { const i = cur.indexOf(m.text); if (i >= 0) cur.splice(i, 1); }
    if (!state.summary[orderId]) state.summary[orderId] = {};
    state.summary[orderId][nodeIdx] = cur.join('\n');
    await sb.from('orders').update({ summary: state.summary[orderId] }).eq('id', parseInt(orderId));
    const o = state.orders.find(x => x.id === orderId);
    document.getElementById('chat-area').innerHTML = renderAdminChatArea(o);
}
async function togglePublishable(orderId, nodeIdx, msgIdx) {
    const m = state.chat[orderId]?.[nodeIdx]?.[msgIdx];
    if (!m) return;
    m.publishable = !m.publishable;
    if (m.id) await sb.from('messages').update({ publishable: m.publishable }).eq('id', m.id);
    const o = state.orders.find(x => x.id === orderId);
    document.getElementById('chat-area').innerHTML = renderAdminChatArea(o);
}
function editSummary(orderId, nodeIdx) {
    const cur = state.summary[orderId]?.[nodeIdx] || '';
    openModal(`
        <div class="modal-drag-bar"></div><div class="modal-header"><h3>编辑交流重点</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><textarea id="summary-edit" style="height:120px;">${cur}</textarea></div>
        <button class="btn" onclick="saveSummary('${orderId}', ${nodeIdx})">保存</button>
    `);
}
async function saveSummary(orderId, nodeIdx) {
    if (!state.summary[orderId]) state.summary[orderId] = {};
    state.summary[orderId][nodeIdx] = document.getElementById('summary-edit').value;
    await sb.from('orders').update({ summary: state.summary[orderId] }).eq('id', parseInt(orderId));
    closeModal(); showToast('已保存');
    setTimeout(() => openOrderDetail(orderId), 100);
}
async function sendAdminMsg(orderId) {
    const input = document.getElementById('chat-input');
    if (!input?.value.trim()) return;
    const content = input.value; input.value = '';
    await sb.from('messages').insert({ order_id: parseInt(orderId), node_index: state.currentChatNode, sender_id: state.user.id, sender_role: 'admin', content });
    await buildChatFromOrders();
    const o = state.orders.find(x => x.id === orderId);
    document.getElementById('chat-area').innerHTML = renderAdminChatArea(o);
    const cb = document.getElementById('chat-box'); if (cb) cb.scrollTop = cb.scrollHeight;
}

function openNodeAction(id, i) {
    const o = state.orders.find(x => x.id === id);
    openModal(`
        <div class="modal-drag-bar"></div><div class="modal-header"><h3>节点操作：${o.nodeNames?.[i] || NODE_NAMES[i]}</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>上传照片 (可多选)</label><input type="file" id="node-photos" accept="image/*" multiple style="padding:10px; border:1px dashed var(--pink);"></div>
        <div class="form-group"><label>配文</label><textarea id="node-desc" placeholder="例如：纸样已经裁好..."></textarea></div>
        <button class="btn" onclick="uploadNodePhotos('${id}', ${i})">保存并完成节点</button>
        <button class="btn btn-danger" style="margin-top:8px;" onclick="skipNode('${id}', ${i})">跳过此工序</button>
    `);
}
async function uploadNodePhotos(id, i) {
    const fileInput = document.getElementById('node-photos');
    const desc = document.getElementById('node-desc').value;
    const files = fileInput.files;
    if (files.length === 0 && !desc) return showToast('请至少上传一张照片或填写配文');
    showToast('正在上传...');
    let photoUrls = [];
    for (const file of files) {
        const ext = file.name.split('.').pop();
        const path = `node_${id}_${i}_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { data, error } = await sb.storage.from('order-images').upload(path, file);
        if (!error) { const { data: { publicUrl } } = sb.storage.from('order-images').getPublicUrl(path); photoUrls.push({ url: publicUrl, caption: desc }); }
    }
    const updates = { status: '已完成', done_at: new Date().toISOString() };
    if (photoUrls.length > 0) updates.photos = photoUrls;
    await sb.from('order_nodes').update(updates).eq('order_id', parseInt(id)).eq('node_index', i);
    if (i === 3) await sb.from('orders').update({ status: '制作中' }).eq('id', parseInt(id));
    const { data: nodes } = await sb.from('order_nodes').select('status').eq('order_id', parseInt(id));
    if (nodes?.every(n => n.status === '已完成' || n.status === '已跳过')) await sb.from('orders').update({ status: '已完成' }).eq('id', parseInt(id));
    closeModal(); showToast('节点完成'); await loadOrders(); renderAdmin(); setTimeout(() => openOrderDetail(id), 100);
}
async function skipNode(id, i) {
    await sb.from('order_nodes').update({ status: '已跳过' }).eq('order_id', parseInt(id)).eq('node_index', i);
    closeModal(); showToast('已跳过'); await loadOrders(); renderAdmin(); setTimeout(() => openOrderDetail(id), 100);
}

/* ================= 作品管理 ================= */
function renderWorks() {
    const pending = state.orders.filter(o => o.status === '已完成');
    document.getElementById('pending-works-area').innerHTML = pending.length ? `
        <div class="card" style="background:#fff8e6;">
            <h4 style="color:#b07a2a; margin-bottom:10px;">📦 已完成订单（${pending.length}）</h4>
            ${pending.map(o => `<div class="pending-work"><div><b>${o.no} ${o.project}</b></div><button class="btn btn-sm" onclick="uploadWorkFromOrder('${o.id}')">一键上传</button></div>`).join('')}
        </div>
    ` : '';
    document.getElementById('works-list').innerHTML = state.works.map(w => `
        <div class="card" style="display:flex; justify-content:space-between;">
            <div><b>${w.title}</b><div style="font-size:12px; color:#888;">${w.category || ''}</div></div>
        </div>
    `).join('');
}
function uploadWorkFromOrder(id) {
    const o = state.orders.find(x => x.id === id);
    openModal(`
        <div class="modal-drag-bar"></div><div class="modal-header"><h3>一键上传作品</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>作品标题</label><input id="gen-title" value="${o.project}"></div>
        <div class="form-group"><label>封面图 URL</label><input id="gen-cover" placeholder="https://..."></div>
        <label style="display:flex; align-items:center; gap:10px; margin-bottom:15px;"><input type="checkbox" id="gen-show-process" checked style="transform:scale(1.3);"><b>公开流程回顾与精选对话</b></label>
        <button class="btn" onclick="confirmUploadWork('${id}')">确认上传</button>
    `);
}
async function confirmUploadWork(id) {
    const o = state.orders.find(x => x.id === id);
    const title = document.getElementById('gen-title').value;
    const cover = document.getElementById('gen-cover').value || 'https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400';
    const showProcess = document.getElementById('gen-show-process').checked;
    let process = null;
    if (showProcess) {
        const names = o.nodeNames || NODE_NAMES;
        process = { nodes: names.map((name, i) => ({ name, status: o.skipped.includes(i) ? '已跳过' : (i < o.nodeIndex ? '已完成' : '待开始'), photos: o.nodePhotos?.[i] || [], summary: state.summary[o.id]?.[i] || null })) };
    }
    await sb.from('portfolios').insert({ title, category: '其他', cover_image: cover, process, order_id: parseInt(id) });
    closeModal(); showToast('作品已上传'); await loadWorks(); renderAdmin();
}

/* ================= 初始化 ================= */
initAuth();
</script>
</body>
