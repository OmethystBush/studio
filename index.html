<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定制工坊管家</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#746097; --primary2:#AD86AE; --pink:#ECD9ED; --cream:#EADACB;
  --bg:#FBF8FB; --text:#333; --text-light:#888; --gray:#B5B0BA;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif;}
body{background:var(--bg);color:var(--text);padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;}

/* ===== 底部导航（5 Tab + 红点 + 安全区）===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--pink);display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -2px 15px rgba(116,96,151,.1);z-index:100;
  border-top-left-radius:15px;border-top-right-radius:15px;
}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text-light);cursor:pointer;transition:.2s;padding:5px 12px;border-radius:14px;}
.nav-item.active{color:var(--primary);font-weight:bold;background:rgba(116,96,151,.12);}
.nav-item svg{width:22px;height:22px;margin-bottom:3px;fill:currentColor;}
.nav-dot{position:absolute;top:2px;right:6px;width:8px;height:8px;border-radius:50%;background:#F44336;display:none;}

.page{display:none;padding:15px;animation:fadeIn .2s;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.page-title{font-size:20px;font-weight:bold;margin-bottom:15px;padding-top:10px;color:var(--primary);}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px;}
.btn:active{opacity:.8;}
.btn-sm{padding:6px 10px;font-size:12px;width:auto;margin-top:0;border-radius:6px;display:inline-block;}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--pink);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:13px;color:var(--text-light);margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:1px solid var(--pink);border-radius:8px;font-size:14px;background:#fff;outline:none;}
.form-group textarea{resize:vertical;min-height:70px;}
.hint{font-size:12px;color:var(--text-light);margin-top:4px;}

/* ===== 排单：月份胶囊 + 容量 ===== */
.month-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
.month-tabs::-webkit-scrollbar{display:none;}
.month-pill{flex:0 0 auto;padding:6px 14px;border-radius:20px;background:#fff;border:1px solid var(--pink);font-size:13px;color:var(--text-light);cursor:pointer;}
.month-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:bold;}
.month-block{margin-bottom:18px;}
.month-head{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.month-head .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.month-head .name{font-size:15px;font-weight:bold;color:var(--primary);}
.cap-line{font-size:12px;color:var(--text-light);display:flex;justify-content:space-between;margin-bottom:3px;}
.cap-bg{height:6px;background:var(--pink);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.cap-fill{height:100%;background:var(--primary);transition:width .3s;}
.cap-fill.full{background:var(--primary2);}
.self-tip{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:#6b5b3e;}

/* ===== 排单卡片（颜色规则重写）===== */
.order-card{position:relative;border-radius:10px;padding:12px 12px 12px 14px;margin-bottom:10px;cursor:pointer;border-left:3px solid transparent;overflow:hidden;}
.order-card.bg-blue{background:var(--pink);border-left-color:var(--primary2);color:var(--text);}
.order-card.bg-purple{background:linear-gradient(135deg,var(--primary),var(--primary2));border-left-color:var(--primary);color:#fff;}
.order-card.bg-purple .order-title,.order-card.bg-purple .oc-sub{color:#fff;}
.order-card.mine{background:var(--cream)!important;border-left-color:var(--primary)!important;color:var(--text)!important;}
.order-card.mine .order-title,.order-card.mine .oc-sub{color:var(--text)!important;}
.order-card.done{background:#efedf1!important;border-left-color:var(--gray)!important;color:#999!important;opacity:.6;}
.order-card.done .order-title,.order-card.done .oc-sub{color:#888!important;}
.oc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;}
.oc-badge{font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.25);}
.oc-mine-badge{position:absolute;top:8px;right:8px;font-size:11px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;}
.oc-title{font-size:15px;font-weight:bold;margin-bottom:4px;}
.oc-sub{font-size:12px;color:var(--text-light);}
.oc-dots{display:flex;gap:3px;margin-top:8px;align-items:center;font-size:11px;color:var(--text-light);}
.oc-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);}
.oc-dot.on{background:var(--primary);}
.order-card.bg-purple .oc-dot{background:rgba(255,255,255,.4);}
.order-card.bg-purple .oc-dot.on{background:#fff;}

/* ===== 时间线 ===== */
.timeline{position:relative;padding-left:22px;margin-top:8px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--pink);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--pink);z-index:2;}
.tl-item.done::before{background:var(--primary);border-color:var(--primary);}
.tl-item.current::before{background:var(--primary2);border-color:var(--primary2);animation:pulse 1.4s infinite;}
.tl-item.skip::before{background:#fff;border-color:var(--gray);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(173,134,174,.6)}70%{box-shadow:0 0 0 8px rgba(173,134,174,0)}100%{box-shadow:0 0 0 0 rgba(173,134,174,0)}}
.tl-name{font-size:14px;color:#888;}
.tl-item.done .tl-name{color:var(--primary);font-weight:bold;}
.tl-item.current .tl-name{color:var(--primary2);font-weight:bold;}
.tl-item.skip .tl-name{text-decoration:line-through;color:#bbb;}
.tl-desc{font-size:12px;color:#aaa;margin-top:2px;}
.tl-meta{font-size:11px;color:var(--text-light);margin-top:2px;}
.tl-photo{width:52px;height:52px;border-radius:6px;object-fit:cover;margin-top:6px;margin-right:6px;}

/* ===== 材料卡片化（手机）===== */
.mat-card{background:#fff;border:1px solid var(--pink);border-radius:10px;padding:10px;margin-bottom:10px;}
.mat-imgs{display:flex;gap:6px;margin-bottom:6px;}
.mat-imgs img{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid var(--pink);}
.mat-status{font-size:11px;padding:1px 8px;border-radius:10px;display:inline-block;}
.st-wait{background:#f1eef4;color:#888;}
.st-ship{background:#FCE9D4;color:#b07a2a;}
.st-arrive{background:#E1F0E1;color:#3e7d3e;}

/* ===== 聊天 ===== */
.chat-box{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0;}
.bubble{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;word-break:break-word;}
.bubble.admin{background:var(--primary);color:#fff;align-self:flex-start;border-bottom-left-radius:3px;}
.bubble.customer{background:var(--cream);color:var(--text);align-self:flex-end;border-bottom-right-radius:3px;}
.bubble.notice{background:var(--pink);color:var(--primary);align-self:stretch;max-width:100%;font-weight:bold;border-radius:8px;}
.bubble img{max-width:160px;border-radius:8px;display:block;margin-top:4px;}
.chat-input{display:flex;gap:8px;margin-top:10px;}
.chat-input input{flex:1;padding:10px;border:1px solid var(--pink);border-radius:20px;font-size:14px;outline:none;}
.chat-input button{flex:0 0 auto;width:auto;padding:0 16px;margin:0;border-radius:20px;}

/* ===== 作品 ===== */
.filter-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:6px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-pill{flex:0 0 auto;padding:5px 14px;border-radius:16px;background:#fff;border:1px solid var(--pink);font-size:13px;color:var(--text-light);cursor:pointer;}
.filter-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pf-item{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;position:relative;}
.pf-item img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
.pf-info{padding:8px 10px;}
.pf-name{font-size:13px;color:var(--primary);font-weight:bold;}
.pf-tag{font-size:11px;color:var(--text-light);margin-top:2px;}
.pf-pin{position:absolute;top:6px;left:6px;background:var(--primary);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;}

/* ===== 后台 tabs ===== */
.admin-tab{display:flex;background:#fff;border-radius:10px;padding:4px;margin-bottom:15px;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.admin-tab div{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:8px;color:var(--text-light);cursor:pointer;}
.admin-tab div.active{background:var(--primary);color:#fff;font-weight:bold;}
.admin-section{display:none;}
.admin-section.active{display:block;}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;}
.dash div{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 2px 10px rgba(116,96,151,.06);}
.dash b{display:block;font-size:18px;color:var(--primary);}
.dash span{font-size:11px;color:var(--text-light);}

/* ===== 上传 ===== */
.upload-area{border:2px dashed var(--primary2);border-radius:8px;padding:16px;text-align:center;color:var(--primary);cursor:pointer;font-size:13px;}
.upload-area input{display:none;}

/* ===== 弹窗 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-content{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px;animation:slideUp .3s;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.modal-header h3{color:var(--primary);font-size:18px;}
.modal-close{font-size:20px;color:#aaa;cursor:pointer;}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(116,96,151,.95);color:#fff;padding:12px 24px;border-radius:20px;font-size:13px;z-index:999;display:none;max-width:80%;text-align:center;}
</style>
</head>
<body>

<!-- ================= 成品 ================= -->
<div id="page-portfolio" class="page active">
  <div class="page-title">成品展示 ✨</div>
  <div class="filter-bar" id="pf-filters"></div>
  <div class="pf-grid" id="portfolio-container"></div>
</div>

<!-- ================= 排单 ================= -->
<div id="page-queue" class="page">
  <div class="page-title">排单进度 📋</div>
  <div id="queue-self-tip"></div>
  <div class="month-tabs" id="month-tabs"></div>
  <div id="queue-container"></div>
</div>

<!-- ================= 申请 ================= -->
<div id="page-apply" class="page">
  <div class="page-title">申请定制 ✉️</div>
  <div class="card">
    <form id="apply-form" onsubmit="submitApply(event)">
      <div class="form-group"><label>您的称呼 *</label><input type="text" id="app-name" required></div>
      <div class="form-group"><label>联系方式 *</label><input type="text" id="app-contact" required placeholder="手机号 / 微信号"></div>
      <div class="form-group"><label>想做什么 *</label><textarea id="app-desc" required placeholder="款式、用途、穿着场合…"></textarea></div>
      <div class="form-group"><label>预算范围</label>
        <select id="app-budget">
          <option value="500以下">500元以下</option>
          <option value="500-1000">500 - 1000元</option>
          <option value="1000-2000">1000 - 2000元</option>
          <option value="2000以上">2000元以上</option>
          <option value="不确定">不确定，想先聊聊</option>
        </select>
      </div>
      <div class="form-group"><label>期望交付时间</label>
        <select id="app-expected" onchange="document.getElementById('app-date-wrap').style.display = this.value==='date'?'block':'none'">
          <option value="不急">不急</option>
          <option value="1个月内">1个月内</option>
          <option value="date">有明确日期</option>
        </select>
      </div>
      <div class="form-group" id="app-date-wrap" style="display:none;"><input type="date" id="app-date"></div>
      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
        <label style="margin:0;">申请加急</label>
        <input type="checkbox" id="app-priority" style="width:auto;" onchange="if(this.checked)showToast('加急位名额有限，可能产生加急费')">
      </div>
      <div class="form-group">
        <label>参考图（可选，最多6张）</label>
        <div class="upload-area" onclick="document.getElementById('app-file').click()"><div id="app-upload-text">📷 点击上传参考图</div></div>
        <input type="file" id="app-file" accept="image/*" multiple onchange="document.getElementById('app-upload-text').innerText = '✅ 已选择 '+this.files.length+' 张图'">
      </div>
      <div class="form-group"><label>特殊要求</label><input type="text" id="app-special" placeholder="如：领口要小立领"></div>
      <button type="submit" class="btn" id="submit-btn">提交申请</button>
    </form>
  </div>
</div>

<!-- ================= 我的订单 ================= -->
<div id="page-my-orders" class="page">
  <div class="page-title">我的订单 📦</div>
  <div id="my-apply-list"></div>
  <div id="my-order-list"></div>
  <div id="order-detail-view" style="display:none;"></div>
</div>

<!-- ================= 我的账户 ================= -->
<div id="page-account" class="page">
  <div class="page-title">我的账户 👤</div>

  <!-- 登录 -->
  <div id="login-view" class="card">
    <h3 style="text-align:center;margin-bottom:20px;color:var(--primary);">登录</h3>
    <div class="form-group"><input type="text" id="login-phone" placeholder="手机号"></div>
    <div class="form-group"><input type="password" id="login-pwd" placeholder="密码"></div>
    <button class="btn" onclick="handleLogin()">登录</button>
    <button class="btn btn-ghost" onclick="showRegister()">注册新账号</button>
  </div>

  <!-- 注册 -->
  <div id="register-view" class="card" style="display:none;">
    <h3 style="text-align:center;margin-bottom:20px;color:var(--primary);">注册</h3>
    <div class="form-group"><input type="text" id="reg-phone" placeholder="手机号"></div>
    <div class="form-group"><input type="text" id="reg-nick" placeholder="昵称"></div>
    <div class="form-group"><input type="password" id="reg-pwd" placeholder="密码（≥6位）"></div>
    <div class="form-group"><input type="password" id="reg-pwd2" placeholder="再次输入密码"></div>
    <div class="form-group"><label>密保问题</label>
      <select id="reg-question">
        <option value="你的生日？">你的生日？</option>
        <option value="你的小学名称？">你的小学名称？</option>
        <option value="你的第一只宠物名字？">你的第一只宠物名字？</option>
      </select>
    </div>
    <div class="form-group"><input type="text" id="reg-answer" placeholder="密保答案"></div>
    <button class="btn" onclick="handleRegister()">注册</button>
    <button class="btn btn-ghost" onclick="showLogin()">返回登录</button>
  </div>

  <!-- 已登录 -->
  <div id="account-view" style="display:none;">
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="avatar" style="width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;">客</div>
        <div>
          <h3 id="account-name" style="color:var(--primary);">用户</h3>
          <div id="account-phone" style="font-size:12px;color:var(--text-light);"></div>
        </div>
      </div>
    </div>
    <div id="admin-entry" style="display:none;">
      <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;cursor:pointer;" onclick="switchTab('admin')">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><b>⚙️ 进入后台管理</b><div style="font-size:12px;opacity:.85;margin-top:4px;" id="admin-badge-text">待处理 0</div></div>
          <div style="font-size:22px;">→</div>
        </div>
      </div>
    </div>
    <div class="card">
      <button class="btn btn-ghost" onclick="editNickname()">修改昵称</button>
      <button class="btn btn-ghost" onclick="editPassword()">修改密码</button>
      <button class="btn" style="background:#fff;color:#F44336;border:1px solid var(--pink);" onclick="handleLogout()">退出登录</button>
    </div>
  </div>
</div>

<!-- ================= 店长后台 ================= -->
<div id="page-admin" class="page">
  <div class="page-title">店长工作台 ⚙️</div>
  <div class="dash" id="admin-dash"></div>
  <div class="admin-tab">
    <div id="tab-apply" class="active" onclick="switchAdminTab('apply')">待审核</div>
    <div id="tab-manage" onclick="switchAdminTab('manage')">排单管理</div>
    <div id="tab-port" onclick="switchAdminTab('port')">作品</div>
  </div>
  <div id="admin-apply" class="admin-section active"><div id="apply-list-container">加载中...</div></div>
  <div id="admin-manage" class="admin-section"><div id="manage-list-container">加载中...</div></div>
  <div id="admin-port" class="admin-section">
    <div class="card">
      <h4 style="margin-bottom:10px;color:var(--primary);">发布新作品</h4>
      <div class="form-group"><label>作品名称</label><input type="text" id="port-title"></div>
      <div class="form-group"><label>分类</label>
        <select id="port-category"><option>衬衫</option><option>连衣裙</option><option>外套</option><option>其他</option></select>
      </div>
      <div class="form-group"><label>标签</label><input type="text" id="port-tags" placeholder="亚麻衬衫 · 2026"></div>
      <div class="form-group"><label>描述</label><textarea id="port-desc"></textarea></div>
      <div class="form-group">
        <label>封面图（3:4 竖图）</label>
        <div class="upload-area" onclick="document.getElementById('port-file').click()"><div id="port-upload-text">📷 点击选择封面图</div></div>
        <input type="file" id="port-file" accept="image/*" onchange="document.getElementById('port-upload-text').innerText = '✅ 已选择封面'">
      </div>
      <button class="btn" onclick="publishPortfolio()">发布</button>
    </div>
  </div>
</div>

<!-- ================= 通用弹窗 ================= -->
<div id="custom-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-body"></div>
</div>

<!-- ================= 底部导航 ================= -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="portfolio" onclick="switchTab('portfolio')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>成品</div>
  <div class="nav-item" data-tab="queue" onclick="switchTab('queue')"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>排单</div>
  <div class="nav-item" data-tab="apply" onclick="switchTab('apply')"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>申请</div>
  <div class="nav-item" data-tab="my-orders" onclick="switchTab('my-orders')"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>订单<span class="nav-dot" id="dot-orders"></span></div>

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=$('toast'); t.innerText=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2500); }
function maskName(name){

function fmtDate(d){
  if(!d) return '';
  const x = new Date(d); if(isNaN(x)) return d;
  return `${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`;

// 压缩图片后再上传，节省存储
async function compressImage(file, maxSide=1600, quality=0.8){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      const scale = Math.min(1, maxSide/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('压缩失败')), 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function uploadImage(bucket, file, prefix='img'){
  const blob = await compressImage(file);
  const name = `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from(bucket).upload(name, blob, { contentType:'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from(bucket).getPublicUrl(name);
  return data.publicUrl;
}

async function loadQueue(){
  // 1. 拉公开视图（脱敏）
  const { data: pub } = await sb.from('public_queue').select('*');
  const orders = pub || [];

  // 2. 拉自己的订单 id（用于标黄）
  let myOrderIds = [];
  if(me){
    const { data:mine } = await sb.from('orders').select('id,order_no,status,schedule_month').eq('user_id', me.id);
    myOrderIds = (mine||[]).map(o=>o.id);
    // 自己订单在队列里排第几
    const myActive = (mine||[]).filter(o=>o.status!=='已完成');
    if(myActive.length){
      $('queue-self-tip').innerHTML = `<div class="self-tip">你的订单 ${myActive.map(o=>'<b>'+esc(o.order_no)+'</b>').join('、')} 已在队列中，请耐心等待～</div>`;
    } else { $('queue-self-tip').innerHTML = ''; }
  } else { $('queue-self-tip').innerHTML = ''; }

  // 3. 按月份分组
  const cur = monthKey();
  const groups = {};
  orders.forEach(o=>{
    const m = o.schedule_month || cur;
    (groups[m] = groups[m] || []).push(o);
  });
  // 确保当前月存在
  if(!groups[cur]) groups[cur] = [];

  // 4. 月份胶囊
  const months = Object.keys(groups).sort((a,b)=> a.localeCompare(b));
  const curIdx = months.indexOf(cur);
  $('month-tabs').innerHTML = months.map((m,i)=>{
    const isCur = m===cur;
    return `<div class="month-pill ${isCur?'active':''}" onclick="document.getElementById('mb-${m}').scrollIntoView({behavior:'smooth',block:'start'})">${monthLabel(m)}${isCur?' (本月)':''}</div>`;
  }).join('');

  // 5. 渲染每个月
  let html = '';
  for(const m of months){
    const list = groups[m];
    const active = list.filter(o=>o.status!=='已完成');
    const done   = list.filter(o=>o.status==='已完成');
    const normalCap = 10, urgentCap = 2;
    const normalUsed = active.filter(o=>!o.is_priority).length;
    const urgentUsed = active.filter(o=>o.is_priority).length;
    const isFull = normalUsed>=normalCap;
    const isCur = m===cur;

    // 排序：加急在前 → sort_order → created_at
    active.sort((a,b)=>{
      if(a.is_priority !== b.is_priority) return a.is_priority ? -1 : 1;
      if((a.sort_order||0) !== (b.sort_order||0)) return (a.sort_order||0)-(b.sort_order||0);
      return new Date(a.created_at) - new Date(b.created_at);
    });

    html += `<div class="month-block" id="mb-${m}">
      <div class="month-head">
        <div class="row">
          <div class="name">${monthLabel(m)}${isCur?' (本月)':''}</div>
          <div style="font-size:12px;color:${isFull?'#b07a2a':'#3e7d3e'}">${isFull?'已满':'未满'}</div>
        </div>
        <div class="cap-line"><span>订单位 ${normalUsed}/${normalCap}</span><span>加急 ${urgentUsed}/${urgentCap}</span></div>
        <div class="cap-bg"><div class="cap-fill ${isFull?'full':''}" style="width:${Math.min(100,normalUsed/normalCap*100)}%"></div></div>
      </div>`;

    if(!active.length && !done.length){
      html += `<div style="text-align:center;color:#bbb;padding:20px;font-size:13px;">本月暂无排单</div>`;
    }

    active.forEach(o=>{
      const isMine = myOrderIds.includes(o.id);
      let cls = 'bg-blue';
      if(o.status==='制作中') cls='bg-purple';
      if(isMine) cls='mine';
      if(isMine && o.status==='制作中') cls='mine';
      html += renderQueueCard(o, cls, isMine);
    });

    if(done.length){
      html += `<div style="font-size:12px;color:#bbb;text-align:center;margin:10px 0;">— 已完成 —</div>`;
      done.forEach(o=>{
        const isMine = myOrderIds.includes(o.id);
        html += renderQueueCard(o, 'done', isMine);
      });
    }

    html += `</div>`;
  }
  $('queue-container').innerHTML = html;
}

function renderQueueCard(o, cls, isMine){
  const dots = Array.from({length: 10}, (_,i)=> `<div class="oc-dot ${i<o.done_count?'on':''}"></div>`).join('');
  const dateText = o.estimated_date
    ? `预计 ${esc(o.estimated_date)}`
    : (o.estimated_period ? `预计${esc(o.estimated_period)}` : '时间待定');
  const name = isMine ? esc(o.client_name) : esc(o.client_name); // 视图已脱敏

  return `<div class="order-card ${cls}" onclick="handleQueueClick('${o.id}', ${isMine})">
    ${isMine?'<div class="oc-mine-badge">⭐ 我的</div>':''}
    <div class="oc-head">
      <span>${esc(o.order_no)} ${o.is_priority?'⚡加急':''}</span>
      <span class="oc-badge">${esc(o.status)}</span>
    </div>
    <div class="oc-title">${name} · ${esc(o.project_name)}</div>
    <div class="oc-sub">📅 ${dateText}</div>
    <div class="oc-dots">${dots}<span style="margin-left:6px;">${o.done_count||0}/10 ${esc(o.current_node||'')}</span></div>
  </div>`;
}

async function openOrderDetail(orderId, role){
  $('my-order-list').style.display='none';
  const box = $('order-detail-view');
  box.style.display='block'; box.innerHTML='加载中…';

  const [{ data:o }, { data:nodes }, { data:mats }, { data:msgs }, { data:logs }] = await Promise.all([
    sb.from('orders').select('*').eq('id',orderId).single(),
    sb.from('order_nodes').select('*').eq('order_id',orderId).order('node_index'),
    sb.from('materials').select('*').eq('order_id',orderId).order('sort_order'),
    sb.from('messages').select('*').eq('order_id',orderId).order('created_at'),
    sb.from('remark_logs').select('*').eq('order_id',orderId).order('changed_at',{ascending:false})
  ]);
  if(!o){ box.innerHTML='订单不存在'; return; }
  const isAdmin = role==='admin' || me?.is_admin;
  const canEditRemark = o.status==='排队中' && (isAdmin || o.user_id===me?.id);

  // 时间线
  const curNode = (nodes||[]).find(n=>n.status!=='已完成' && n.status!=='已跳过');
  const tl = (nodes||[]).map(n=>{
    let cls = '';
    if(n.status==='已完成') cls='done';
    else if(n.status==='已跳过') cls='skip';
    else if(curNode && n.id===curNode.id) cls='current';
    const photos = (n.photos||[]).map(p=>`<img class="tl-photo" src="${esc(p.url||p)}" onclick="window.open('${esc(p.url||p)}')">`).join('');
    return `<div class="tl-item ${cls}">
      <div class="tl-name">${n.node_index}. ${esc(n.node_name)}${n.status==='已跳过'?'（本单无此工序）':''}</div>
      ${n.node_desc?`<div class="tl-desc">${esc(n.node_desc)}</div>`:''}
      ${n.done_at?`<div class="tl-meta">✓ ${fmtDate(n.done_at)}</div>`:''}
      ${photos}
    </div>`;
  }).join('');

  // 材料卡片
  const matHtml = (mats||[]).map(m=>{
    const stCls = m.status==='已到货'?'st-arrive':m.status==='运输中'?'st-ship':'st-wait';
    return `<div class="mat-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <b>${esc(m.name)}</b><span class="mat-status ${stCls}">${esc(m.status||'待采购')}</span>
      </div>
      <div style="font-size:12px;color:var(--text-light);">${esc(m.spec||'')} ${esc(m.quantity||'')}${esc(m.unit||'')} × ¥${m.unit_price||0}</div>
      <div class="mat-imgs">
        ${m.shop_image?`<img src="${esc(m.shop_image)}">`:''}
        ${m.real_image?`<img src="${esc(m.real_image)}">`:''}
      </div>
      ${m.arrival_date?`<div style="font-size:11px;color:#888;">到货：${esc(m.arrival_date)}</div>`:''}
    </div>`;
  }).join('');

  // 聊天
  const chatHtml = (msgs||[]).map(m=>{
    const mine = (m.sender_id===me?.id);
    if(m.is_notice) return `<div class="bubble notice">📢 ${esc(m.content)}</div>`;
    const cls = m.sender_role==='admin' ? 'admin' : 'customer';
    return `<div class="bubble ${cls}">${esc(m.content)}${m.image_url?`<img src="${esc(m.image_url)}">`:''}</div>`;
  }).join('');

  // 备注
  const remarkLocked = o.status!=='排队中';

  box.innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:12px;" onclick="closeOrderDetail()">← 返回</button>

    <div class="card">
      <div style="display:flex;justify-content:space-between;">
        <h3 style="color:var(--primary);">${esc(o.project_name)}</h3>
        <span style="font-weight:bold;color:var(--primary);">${esc(o.status)}</span>
      </div>
      <p style="font-size:13px;color:var(--text-light);margin-top:6px;">
        ${esc(o.order_no)} · ${esc(o.client_name)}
      </p>
      <p style="font-size:13px;color:var(--text-light);">
        预估：${esc(o.estimated_date||o.estimated_period||'待定')}
      </p>
    </div>

    <div class="card">
      <h4 style="color:var(--primary);margin-bottom:8px;">📝 备注</h4>
      <p style="font-size:13px;">版型：${esc(o.remark_pattern||'无')}</p>
      <p style="font-size:13px;margin-top:4px;">面料：${esc(o.remark_fabric||'无')}</p>
      ${remarkLocked?`<div style="font-size:12px;color:#888;margin-top:8px;">🔒 已开始制作，如需修改请在下方留言与店长沟通</div>`:''}
      ${canEditRemark?`<button class="btn btn-sm" style="background:var(--pink);color:var(--primary);margin-top:8px;" onclick="editRemark('${o.id}')">编辑备注</button>`:''}
      ${logs && logs.length?`<div style="font-size:11px;color:#aaa;margin-top:8px;">最近修改：${esc(logs[0].field)} ${esc(logs[0].old_value||'空')} → ${esc(logs[0].new_value||'空')} · ${fmtDate(logs[0].changed_at)}</div>`:''}
    </div>

    <div class="card">
      <h4 style="color:var(--primary);margin-bottom:8px;">🧵 定制流程</h4>
      <div class="timeline">${tl||'等待更新'}</div>
    </div>

    <div class="card">
      <h4 style="color:var(--primary);margin-bottom:8px;">🧵 材料清单</h4>
      ${matHtml||'<div style="font-size:13px;color:#aaa;">暂无材料</div>'}
    </div>

    <div class="card">
      <h4 style="color:var(--primary);margin-bottom:8px;">💬 沟通</h4>
      <div class="chat-box" id="chat-box">${chatHtml||'<div style="text-align:center;color:#bbb;font-size:13px;padding:10px;">暂无消息</div>'}</div>
      <div class="chat-input">
        <input id="chat-input" placeholder="输入留言…">
        <button class="btn" onclick="sendMessage('${o.id}')">发送</button>
      </div>
      ${isAdmin?`<button class="btn btn-ghost" style="margin-top:8px;" onclick="sendNotice('${o.id}')">📢 发通知</button>`:''}
    </div>

    ${isAdmin?renderAdminOrderControls(o,nodes):''}
  `;

  // 滚到底
  const cb = $('chat-box'); if(cb) cb.scrollTop = cb.scrollHeight;

  // 标记已读
  if(isAdmin) await sb.from('orders').update({admin_last_read:new Date().toISOString(), remark_unread:false}).eq('id',o.id);
  else if(o.user_id===me?.id) await sb.from('orders').update({customer_last_read:new Date().toISOString()}).eq('id',o.id);
}

function closeOrderDetail(){
  $('order-detail-view').style.display='none';
  if(me?.is_admin){ loadAdminAll(); }
  else loadMyOrders();
}

async function editRemark(orderId){
  if(!confirm('确定要修改备注吗？修改后店长会收到提醒')) return;
  const pattern = prompt('版型备注', '');
  const fabric  = prompt('面料备注', '');
  const { data:old } = await sb.from('orders').select('remark_pattern,remark_fabric').eq('id',orderId).single();
  await sb.from('orders').update({ remark_pattern:pattern, remark_fabric:fabric, remark_unread:true }).eq('id',orderId);
  // 记日志
  if(old){
    if(old.remark_pattern!==pattern) await sb.from('remark_logs').insert([{order_id:orderId,field:'pattern',old_value:old.remark_pattern,new_value:pattern}]);
    if(old.remark_fabric!==fabric) await sb.from('remark_logs').insert([{order_id:orderId,field:'fabric',old_value:old.remark_fabric,new_value:fabric}]);
  }
  showToast('已保存，店长会收到提醒');
  openOrderDetail(orderId,'customer');
}

async function sendMessage(orderId){
  const input = $('chat-input'); const content = input.value.trim(); if(!content) return;
  await sb.from('messages').insert([{ order_id:orderId, sender_id:me?.id, sender_role: me?.is_admin?'admin':'customer', content }]);
  input.value='';
  openOrderDetail(orderId, me?.is_admin?'admin':'customer');
}
async function sendNotice(orderId){
  const content = prompt('通知内容'); if(!content) return;
  await sb.from('messages').insert([{ order_id:orderId, sender_id:me?.id, sender_role:'admin', content, is_notice:true }]);
  openOrderDetail(orderId,'admin');
}

/* =====================================================================
   店长后台
   ===================================================================== */
function switchAdminTab(type){
  document.querySelectorAll('.admin-tab div').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(el=>el.classList.remove('active'));
  $('tab-'+type).classList.add('active');
  $('admin-'+type).classList.add('active');
}

async function loadAdminAll(){
  await refreshAdminBadge();
  // 数据面板
  const [{ count:a }, { count:m }, { count:u }] = await Promise.all([
    sb.from('applications').select('*',{count:'exact',head:true}).eq('status','待审核'),
    sb.from('messages').select('*',{count:'exact',head:true}),
    sb.from('orders').select('*',{count:'exact',head:true}).eq('remark_unread',true)
  ]);
  $('admin-dash').innerHTML = `
    <div><b>${a||0}</b><span>待审核</span></div>
    <div><b>${u||0}</b><span>需求变更</span></div>
    <div><b>${m||0}</b><span>消息总数</span></div>`;
  loadAdminApplications();
  loadAdminOrders();
}

async function loadAdminApplications(){
  const { data } = await sb.from('applications').select('*').eq('status','待审核').order('created_at',{ascending:false});
  const box = $('apply-list-container');
  if(!data || !data.length){ box.innerHTML = '<div style="text-align:center;color:#aaa;">暂无申请</div>'; return; }
  box.innerHTML = data.map(a=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;">
        <b>${esc(a.applicant_name)} (${esc(a.contact)})</b>
        <span style="font-size:12px;">${fmtDate(a.created_at)}</span>
      </div>
      <p style="font-size:13px;color:#555;margin:8px 0;white-space:pre-wrap;">${esc(a.description)}</p>
      <div style="font-size:12px;color:var(--text-light);">
        预算：${esc(a.budget_range||'-')} · 期望：${esc(a.expected_date||'-')} · ${a.want_priority?'⚡加急':''}
      </div>
      ${(a.images||[]).length?`<div style="display:flex;gap:6px;overflow-x:auto;margin-top:8px;">${a.images.map(u=>`<img src="${esc(u)}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;">`).join('')}</div>`:''}
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button class="btn btn-sm" style="background:var(--primary);flex:1;" onclick="acceptApply('${a.id}')">接单</button>
        <button class="btn btn-sm" style="background:#fff;color:#F44336;border:1px solid var(--pink);flex:1;" onclick="rejectApply('${a.id}')">不接</button>
      </div>
    </div>`).join('');
}

async function acceptApply(appId){
  const { data:a } = await sb.from('applications').select('*').eq('id',appId).single();
  if(!a) return;
  const projectName = prompt('项目名', (a.description||'').slice(0,10)) || '新定制款';
  const isPriority = confirm('是否加急？') || a.want_priority;
  // 自动排月
  const curMonth = monthKey();
  const { data:existing } = await sb.from('orders').select('schedule_month').eq('status','排队中');
  const counts = {};
  (existing||[]).forEach(o=> counts[o.schedule_month] = (counts[o.schedule_month]||0)+1);
  let targetMonth = curMonth;
  let [y,m] = curMonth.split('-').map(Number);
  while((counts[targetMonth]||0) >= 10){
    m++; if(m>12){ m=1; y++; }
    targetMonth = `${y}-${String(m).padStart(2,'0')}`;
  }

  const orderNo = '#000' + (Date.now()%10000);
  const { data:ord, error } = await sb.from('orders').insert([{
    order_no: orderNo, client_name:a.applicant_name, contact:a.contact,
    user_id:a.user_id, project_name:projectName, status:'排队中',
    is_priority:isPriority, schedule_month:targetMonth,
    application_id:a.id
  }]).select().single();
  if(error){ showToast('建单失败：'+error.message); return; }

  const nodeDefs = [
    ['沟通','拆件沟通','把款式拆成领型、袖型、门襟、口袋、下摆等部件，逐个确认做法'],
    ['沟通','版型确认','确认尺寸数据和松量廓形，出尺寸表，顾客确认'],
    ['沟通','布料选择','提供面料小样或商家实拍，确定主料、里料和辅料'],
    ['沟通','下单确认','确认最终报价、支付定金，面辅料下单采购'],
    ['制作','面料预缩','布料到货后下水或蒸汽预缩，防止成衣缩水变形'],
    ['制作','打版裁片','制作纸样并裁剪布片'],
    ['制作','缝制拼接','主体缝纫：拼合衣片、上领、装袖等'],
    ['制作','整烫定型','分阶段熨烫，让版型立体挺括'],
    ['制作','细节装饰','钉扣、锁眼、刺绣、印花等收尾工艺'],
    ['制作','质检包装','检查线头、尺寸和对称度，打包']
  ];
  await sb.from('order_nodes').insert(nodeDefs.map((n,i)=>({
    order_id:ord.id, node_index:i+1, node_name:n[1], node_desc:n[2], phase:n[0], status:'待开始'
  })));
  await sb.from('applications').update({status:'已接单'}).eq('id',appId);
  showToast('已接单，排入 '+monthLabel(targetMonth));
  loadAdminAll();
}

async function rejectApply(appId){
  const reason = prompt('拒绝原因（可选）','档期已满');
  await sb.from('applications').update({status:'已拒绝',reject_reason:reason||''}).eq('id',appId);
  showToast('已拒绝'); loadAdminApplications();
}

async function loadAdminOrders(){
  const { data } = await sb.from('orders').select('*').order('created_at',{ascending:false});
  const box = $('manage-list-container');
  if(!data || !data.length){ box.innerHTML='<div style="text-align:center;color:#aaa;">暂无订单</div>'; return; }
  box.innerHTML = data.map(o=>`
    <div class="card" style="border-left:4px solid ${o.remark_unread?'#F44336':'transparent'};">
      <div style="display:flex;justify-content:space-between;">
        <b>${esc(o.order_no)} ${esc(o.client_name)}${o.remark_unread?' 🔴':''}</b>
        <span style="color:var(--primary);font-size:12px;">${esc(o.status)}</span>
      </div>
      <div style="font-size:12px;color:#888;margin:5px 0;">
        ${esc(o.project_name)} · ${esc(o.schedule_month||'')} ${o.is_priority?'⚡':''}
      </div>
      <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" style="background:var(--pink);color:var(--primary);" onclick="openOrderDetail('${o.id}','admin')">详情/编辑</button>
        <button class="btn btn-sm" onclick="quickStatus('${o.id}','排队中')">排队</button>
        <button class="btn btn-sm" onclick="quickStatus('${o.id}','制作中')">制作</button>
        <button class="btn btn-sm" onclick="quickStatus('${o.id}','已完成')">完成</button>
      </div>
    </div>`).join('');
}

function renderAdminOrderControls(o, nodes){
  const nodeOpts = (nodes||[]).filter(n=>n.status==='待开始').map(n=>`<option value="${n.id}">${esc(n.node_name)}</option>`).join('');
  return `<div class="card">
    <h4 style="color:var(--primary);margin-bottom:8px;">⚙️ 店长操作</h4>
    <div class="form-group"><label>预估日期</label><input type="date" id="ed-date" value="${esc(o.estimated_date||'')}"></div>
    <div class="form-group"><label>预估旬</label>
      <select id="ed-period">
        <option value="">-</option>
        <option ${o.estimated_period==='上旬'?'selected':''}>上旬</option>
        <option ${o.estimated_period==='中旬'?'selected':''}>中旬</option>
        <option ${o.estimated_period==='下旬'?'selected':''}>下旬</option>
      </select>
    </div>
    <div class="form-group"><label>勾选完成的节点</label>
      <select id="ed-node"><option value="">不更新</option>${nodeOpts}</select>
    </div>
    <button class="btn" onclick="saveAdminOrder('${o.id}')">保存</button>
  </div>`;
}

async function quickStatus(id, status){
  await sb.from('orders').update({status, updated_at:new Date().toISOString()}).eq('id',id);
  showToast('状态已更新'); loadAdminOrders();
}

async function saveAdminOrder(id){
  const date = $('ed-date').value;
  const period = $('ed-period').value;
  const nodeId = $('ed-node').value;
  await sb.from('orders').update({ estimated_date:date, estimated_period:period, updated_at:new Date().toISOString() }).eq('id',id);
  if(nodeId){
    await sb.from('order_nodes').update({ status:'已完成', done_at:new Date().toISOString() }).eq('id',nodeId);
    // 自动联动状态
    const { data:o } = await sb.from('orders').select('status').eq('id',id).single();
    const { data:done } = await sb.from('order_nodes').select('node_index').eq('id',nodeId).single();
    if(done?.node_index===4 && o.status==='排队中') await sb.from('orders').update({status:'制作中'}).eq('id',id);
    if(done?.node_index===10) await sb.from('orders').update({status:'已完成'}).eq('id',id);
  }
  showToast('已保存'); openOrderDetail(id,'admin');
}

/* =====================================================================
   发布作品
   ===================================================================== */
async function publishPortfolio(){
  const title = $('port-title').value.trim();
  if(!title) return showToast('请填写作品名称');
  const file = $('port-file').files[0];
  let cover = '';
  if(file) cover = await uploadImage('portfolio-images', file, 'port');
  const { error } = await sb.from('portfolios').insert([{
    title, category: $('port-category').value,
    tags: $('port-tags').value, description: $('port-desc').value,
    cover_image: cover, is_hidden:false, is_pinned:false
  }]);
  if(error) return showToast('发布失败：'+error.message);
  showToast('🎉 发布成功');
  $('port-title').value=''; $('port-desc').value=''; $('port-tags').value='';
  $('port-upload-text').innerText='📷 点击选择封面图';
  switchTab('portfolio');
}

/* =====================================================================
   启动
   ===================================================================== */
sb.auth.onAuthStateChange(async (event, session)=>{
  if(session?.user){ await loadMe(session.user.id); }
  else { me = null; }
  renderAccount();
});
window.addEventListener('DOMContentLoaded', async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session?.user) await loadMe(session.user.id);
  renderAccount();
  loadPortfolio();
  loadQueue();
});
</script>
