<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>定制工坊管家</title>
<style>
:root {
    --primary: #746097; --primary2: #AD86AE; --pink: #ECD9ED; --cream: #EADACB;
    --bg: #FBF8FB; --text: #333; --text-light: #888; --gray: #B5B0BA; --danger: #F44336;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: calc(70px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
.loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 15px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--pink); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--pink); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -2px 15px rgba(116,96,151,.1); z-index: 100; border-top-left-radius: 15px; border-top-right-radius: 15px;}
.nav-item { position: relative; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-light); cursor: pointer; padding: 5px 10px; border-radius: 14px; flex: 1; max-width: 80px;}
.nav-item.active { color: var(--primary); font-weight: bold; background: rgba(116,96,151,.12); }
.nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; fill: currentColor; }

.page { display: none; padding: 15px; animation: fadeIn .2s; }
.page.active { display: block; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.page-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; padding-top: 10px; color: var(--primary); }
.card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(116,96,151,.06); }
.card-click { cursor: pointer; }
.btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: .1s;}
.btn:active { opacity: .8; transform: scale(0.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: 6px 10px; font-size: 12px; width: auto; margin-top: 0; border-radius: 6px; display: inline-block; }
.btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--pink); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }

.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 13px; color: var(--text); font-weight: bold; margin-bottom: 8px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--pink); border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
.form-group textarea { resize: vertical; height: 80px; }
.form-group input:disabled { background: #f5f5f5; color: var(--text-light); }
.upload-box { border: 2px dashed var(--primary2); border-radius: 8px; padding: 15px; text-align: center; color: var(--primary); cursor: pointer; font-size: 13px; background: var(--bg); }
.check-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--pink); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
.check-row input { transform: scale(1.3); }
.hint { font-size: 12px; color: #b07a2a; background: #fff8e6; border-radius: 6px; padding: 8px 10px; margin-bottom: 15px; display: none; }

.img-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.img-thumb { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--pink); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb .del { position: absolute; top: 0; right: 0; width: 18px; height: 18px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }
.img-thumb.add { display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--primary); background: var(--bg); border-style: dashed; cursor: pointer; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
.filter-pill { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--pink); font-size: 13px; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-item { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer; position: relative;}
.pf-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.pf-info { padding: 8px 10px; }
.pf-name { font-size: 13px; color: var(--primary); font-weight: bold; }
.pf-pin { position: absolute; top: 6px; left: 6px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 8px; }

.month-tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
.month-pill { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--pink); font-size: 13px; color: var(--text-light); white-space: nowrap; cursor: pointer; }
.month-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }
.month-head { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; }

.order-card { position: relative; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 3px solid transparent; cursor: pointer; }
.order-card.bg-purple { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
.order-card.mine { background: var(--cream); border-left-color: var(--primary); }
.order-card.done { background: #efedf1; border-left-color: var(--gray); opacity: 0.6; }
.order-card.mine.done { opacity: 0.6; border-left-color: var(--gray); background: #efedf1; }
.mine-badge { position: absolute; top: 0; right: 0; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 0 10px 0 8px; }
.oc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
.oc-badge { padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,.25); }
.oc-priority { background: var(--danger); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: 4px; font-size: 11px;}
.oc-title { font-size: 15px; font-weight: bold; }

.timeline { position: relative; padding-left: 22px; margin-top: 8px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--pink); }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ''; position: absolute; left: -22px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--pink); z-index: 2; }
.tl-item.done::before { background: var(--primary); border-color: var(--primary); }
.tl-item.current::before { background: var(--primary2); border-color: var(--primary2); animation: pulse 1.4s infinite; }
.tl-item.skip::before { background: #fff; border-color: var(--gray); }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(173,134,174,.6)} 70%{box-shadow:0 0 0 8px rgba(173,134,174,0)} 100%{box-shadow:0 0 0 0 rgba(173,134,174,0)} }
.tl-name { font-size: 14px; color: #888; }
.tl-item.done .tl-name { color: var(--primary); font-weight: bold; }
.tl-item.current .tl-name { color: var(--primary2); font-weight: bold; }

.chat-box { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 5px; background: var(--bg); border-radius: 8px; border: 1px solid var(--pink); }
.chat-msg { display: flex; flex-direction: column; max-width: 85%; position: relative; }
.chat-msg.admin { align-self: flex-end; align-items: flex-end; }
.chat-msg.customer { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
.bubble.admin { background: var(--primary); color: #fff; border-bottom-right-radius: 2px; }
.bubble.customer { background: var(--cream); color: var(--text); border-bottom-left-radius: 2px; }
.chat-input { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.chat-input input { flex: 1; padding: 10px 15px; border: 1px solid var(--pink); border-radius: 20px; font-size: 14px; outline: none; background: #fff;}

.admin-tab { display: flex; background: #fff; border-radius: 10px; padding: 4px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(116,96,151,.06); overflow-x: auto; }
.admin-tab div { flex: 1; text-align: center; padding: 8px; font-size: 13px; border-radius: 8px; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.admin-tab div.active { background: var(--primary); color: #fff; font-weight: bold; }
.admin-sec { display: none; }
.admin-sec.active { display: block; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-content { background: var(--bg); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp .3s; max-height: 95vh; overflow-y: auto; touch-action: pan-y; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom:10px; border-bottom:1px solid var(--pink);}
.modal-header h3 { color: var(--primary); font-size: 18px; }
.modal-close { font-size: 20px; color: #aaa; cursor: pointer; }
.modal-drag-bar { width: 40px; height: 4px; background: var(--pink); border-radius: 2px; margin: 0 auto 12px; }

#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(116,96,151,.95); color: #fff; padding: 12px 24px; border-radius: 20px; font-size: 13px; z-index: 999; display: none; text-align: center; max-width: 80%; }
</style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="color: var(--primary); font-size: 14px;">加载中…</div>
</div>

<div id="app" style="display:none;">
    <div id="page-portfolio" class="page active">
        <div class="page-title">成品展示 ✨</div>
        <div class="filter-bar" id="portfolio-filters"></div>
        <div class="pf-grid" id="portfolio-container"></div>
    </div>

    <div id="page-queue" class="page">
        <div class="page-title">排单进度</div>
        <div class="month-tabs" id="month-tabs"></div>
        <div class="month-head" id="month-head"></div>
        <div id="queue-container"></div>
    </div>

    <div id="page-apply" class="page">
        <div class="page-title">申请定制 ✉️</div>
        <div class="card" id="apply-form-area">
            <form onsubmit="submitApply(event)">
                <div class="form-group"><label>您的称呼 *</label><input type="text" id="apply-name" required></div>
                <div class="form-group"><label>联系方式 *</label><input type="text" id="apply-contact" required></div>
                <div class="form-group"><label>想做什么 *</label><textarea id="apply-desc" required placeholder="款式、用途…"></textarea></div>
                <div class="form-group"><label>预算范围 *</label>
                    <select id="apply-budget"><option>500 以下</option><option>500-1000</option><option>1000-2000</option><option>2000+</option><option>不确定</option></select>
                </div>
                <div class="check-row"><label>申请加急 ⚡</label><input type="checkbox" id="apply-priority" onchange="document.getElementById('priority-hint').style.display = this.checked ? 'block' : 'none'"></div>
                <div class="hint" id="priority-hint">加急位名额有限，可能产生加急费</div>
                <button type="submit" class="btn" id="apply-submit-btn">提交申请</button>
            </form>
        </div>
        <div id="apply-success-area" class="card" style="display:none; text-align:center; padding:40px;">
            <h2 style="color:var(--primary); font-size:40px;">✅</h2>
            <h3 style="color:var(--primary); margin:15px 0;">申请已提交</h3>
            <button class="btn" onclick="switchTab('my-orders')">查看我的申请</button>
        </div>
    </div>

    <div id="page-my-orders" class="page">
        <div class="page-title">我的订单</div>
        <div id="my-order-list"></div>
        <div id="order-detail-view" style="display:none;"></div>
    </div>

    <div id="page-account" class="page">
        <div class="page-title">我的账户</div>
        <div id="account-content"></div>
    </div>

    <div id="page-admin" class="page">
        <div class="page-title">店长工作台 ⚙️</div>
        <div class="admin-tab">
            <div id="tab-review" class="active" onclick="switchAdminTab('review')">审核</div>
            <div id="tab-orders" onclick="switchAdminTab('orders')">订单</div>
        </div>
        <div id="admin-review" class="admin-sec active"><div id="apply-list"></div></div>
        <div id="admin-orders" class="admin-sec"><div id="order-manage-list"></div></div>
    </div>

    <div class="bottom-nav" id="bottom-nav"></div>
</div>

<div id="login-page" class="page active" style="display:none;">
    <div class="page-title">定制工坊管家</div>
    <div class="card">
        <h3 style="color:var(--primary); text-align:center; margin-bottom:20px;">登录 / 注册</h3>
        <div class="form-group"><label>手机号</label><input type="text" id="login-phone" placeholder="13800001234"></div>
        <div class="form-group"><label>密码</label><input type="password" id="login-pwd" placeholder="≥6 位"></div>
        <button class="btn" onclick="doLogin()" id="login-btn">登录</button>
        <button class="btn btn-ghost" style="margin-top:8px;" onclick="openRegisterModal()">注册新账号</button>
    </div>
</div>

<div id="custom-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" id="modal-body"></div>
</div>

<div id="toast">提示信息</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lvbxdtpjondnttzxiqxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_a9GY13wrjtGVroA6NPpvTA_Qv3bulQ_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { user: null, isLogin: false, isAdmin: false, currentMonth: null, currentOrderId: null, orders: [], works: [], applications: [], monthData: {} };
const NODE_NAMES = ['拆件沟通','版型确认','布料选择','下单确认','面料预缩','打版裁片','缝制拼接','整烫定型','细节装饰','质检包装','寄出/交付'];

function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2000); }
function closeModal() { document.getElementById('custom-modal').classList.remove('show'); }
function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('custom-modal').classList.add('show'); }
function maskPhone(p) { return p ? p.slice(0,3) + '****' + p.slice(7) : ''; }
function phoneToEmail(p) { return p + '@studio.local'; }

// 认证
async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await loadProfile(session.user);
    else showLoginPage();
    document.getElementById('loading').style.display = 'none';
}
async function loadProfile(user) {
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (!data) { await sb.auth.signOut(); showLoginPage(); return; }
    state.user = data; state.isLogin = true; state.isAdmin = data.is_admin;
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderBottomNav();
    await loadData();
    switchTab('portfolio');
}
function showLoginPage() { document.getElementById('login-page').style.display = 'block'; document.getElementById('app').style.display = 'none'; }
async function doLogin() {
    const p = document.getElementById('login-phone').value.trim(); const pwd = document.getElementById('login-pwd').value;
    if (!p || pwd.length < 6) return showToast('格式错误');
    const { data, error } = await sb.auth.signInWithPassword({ email: phoneToEmail(p), password: pwd });
    if (error) return showToast('账号或密码错误');
    await loadProfile(data.user);
}
function openRegisterModal() {
    openModal(`
        <div class="modal-drag-bar"></div><div class="modal-header"><h3>注册新账号</h3><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="form-group"><label>手机号</label><input id="reg-phone" placeholder="13800001234"></div>
        <div class="form-group"><label>昵称</label><input id="reg-nick" placeholder="称呼"></div>
        <div class="form-group"><label>密码（≥6 位）</label><input type="password" id="reg-pwd"></div>
        <button class="btn" onclick="submitRegister()">注册并登录</button>
    `);
}
async function submitRegister() {
    const p = document.getElementById('reg-phone').value.trim(); const n = document.getElementById('reg-nick').value.trim(); const pwd = document.getElementById('reg-pwd').value;
    if (!p || !n || pwd.length < 6) return showToast('请完整填写');
    const { data, error } = await sb.auth.signUp({ email: phoneToEmail(p), password: pwd, options: { data: { phone: p, nickname: n } } });
    if (error) return showToast('注册失败: ' + error.message);
    await sb.from('profiles').insert([{ id: data.user.id, phone: p, nickname: n }]);
    closeModal(); showToast('注册成功'); await loadProfile(data.user);
}
async function doLogout() { await sb.auth.signOut(); location.reload(); }

// 导航
function renderBottomNav() {
    const tabs = state.isAdmin ? [
        { id: 'portfolio', label: '成品', icon: '<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>' },
        { id: 'admin', label: '后台', icon: '<path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>' },
        { id: 'account', label: '我的', icon: '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>' }
    ] : [
        { id: 'portfolio', label: '成品', icon: '<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>' },
        { id: 'queue', label: '排单', icon: '<path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>' },
        { id: 'apply', label: '申请', icon: '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>' },
        { id: 'my-orders', label: '订单', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>' },
        { id: 'account', label: '我的', icon: '<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>' }
    ];
    document.getElementById('bottom-nav').innerHTML = tabs.map(t => `
        <div class="nav-item" data-tab="${t.id}" onclick="switchTab('${t.id}')"><svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}</div>
    `).join('');
}
function switchTab(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    const nav = document.querySelector(`.nav-item[data-tab="${id}"]`); if(nav) nav.classList.add('active');
    if (id === 'portfolio') renderPortfolio();
    if (id === 'queue') renderQueue();
    if (id === 'my-orders') renderMyOrders();
    if (id === 'account') renderAccount();
    if (id === 'admin') renderAdmin();
    window.scrollTo(0,0);
}

// 数据
async function loadData() {
    const { data: works } = await sb.from('portfolios').select('*').order('created_at', { ascending: false });
    state.works = works || [];
    let q = sb.from('orders').select('*').order('created_at', { ascending: false });
    if (!state.isAdmin) q = q.eq('user_id', state.user.id);
    const { data: orders } = await q;
    state.orders = orders || [];
    
    if (state.orders.length) {
        const ids = state.orders.map(o => o.id);
        const { data: nodes } = await sb.from('order_nodes').select('*').in('order_id', ids).order('node_index');
        const nodeMap = {};
        (nodes||[]).forEach(n => { (nodeMap[n.order_id] = nodeMap[n.order_id]||[]).push(n); });
        state.orders.forEach(o => {
            const ns = nodeMap[o.id] || [];
            o.nodeIndex = ns.filter(n => n.status === '已完成').length;
            o.nodeNames = ns.map(n => n.node_name);
            if(!o.nodeNames.length) o.nodeNames = NODE_NAMES;
        });
    }
    
    if (state.isAdmin) {
        const { data: apps } = await sb.from('applications').select('*').order('created_at', { ascending: false });
        state.applications = apps || [];
    }
}

// 渲染
function renderPortfolio() {
    document.getElementById('portfolio-filters').innerHTML = '<div class="filter-pill active">全部</div>';
    document.getElementById('portfolio-container').innerHTML = state.works.map(w => `
        <div class="pf-item"><img src="${w.cover_image || 'https://images.unsplash.com/photo-1596755094514-f87e32f85e2c?auto=format&fit=crop&q=80&w=400'}"><div class="pf-info"><div class="pf-name">${w.title}</div></div></div>
    `).join('') || '<p style="text-align:center; color:var(--text-light); padding:20px; grid-column:span 2;">暂无作品</p>';
}
function renderQueue() {
    const curM = new Date().toISOString().slice(0,7);
    document.getElementById('month-tabs').innerHTML = `<div class="month-pill active">${curM.replace('-','年')}月</div>`;
    document.getElementById('month-head').innerHTML = `<b style="color:var(--primary);">本月排单进度</b>`;
    const list = state.orders.filter(o => o.schedule_month === curM);
    document.getElementById('queue-container').innerHTML = list.map(o => `
        <div class="order-card ${o.user_id===state.user.id?'mine':(o.status==='制作中'?'bg-purple':'')}">
            <div class="oc-head"><span>${o.order_no}</span><span class="oc-badge">${o.status}</span></div>
            <div class="oc-title">${o.client_name.charAt(0)}** · ${o.project_name}</div>
        </div>
    `).join('') || '<p style="text-align:center; color:var(--text-light); padding:20px;">暂无订单</p>';
}
function renderMyOrders() {
    document.getElementById('my-order-list').style.display = 'block';
    document.getElementById('order-detail-view').style.display = 'none';
    document.getElementById('my-order-list').innerHTML = state.orders.map(o => `
        <div class="card card-click" onclick="openOrderDetail('${o.id}')">
            <div style="display:flex; justify-content:space-between;"><b>${o.project_name}</b><span style="color:var(--primary);">${o.status}</span></div>
            <div style="font-size:12px; color:#888; margin-top:6px;">${o.order_no} · ${o.nodeNames[o.nodeIndex]||'完成'}</div>
        </div>
    `).join('') || '<p style="text-align:center; color:#aaa; padding:20px;">暂无订单</p>';
}
function renderAccount() {
    document.getElementById('account-content').innerHTML = `
        <div class="card"><h3 style="color:var(--primary);">${state.user.nickname}</h3><p style="font-size:12px; color:#888;">${maskPhone(state.user.phone)} ${state.isAdmin?'· 店长':''}</p></div>
        <div class="card"><button class="btn btn-danger" onclick="doLogout()">退出登录</button></div>
    `;
}

// 详情与聊天
async function openOrderDetail(id) {
    const o = state.orders.find(x => x.id === id);
    document.getElementById('my-order-list').style.display = 'none';
    const view = document.getElementById('order-detail-view');
    view.style.display = 'block';
    
    const { data: msgs } = await sb.from('messages').select('*').eq('order_id', id).order('created_at');
    const chatHtml = (msgs||[]).map(m => `
        <div class="chat-msg ${m.sender_role}"><div class="bubble ${m.sender_role}">${m.content}</div></div>
    `).join('');
    
    const tlHtml = o.nodeNames.map((name, i) => `
        <div class="tl-item ${i<o.nodeIndex?'done':(i===o.nodeIndex?'current':'')}"><div class="tl-name">${i+1}. ${name}</div></div>
    `).join('');

    view.innerHTML = `
        <button class="btn btn-ghost" style="margin-bottom:12px;" onclick="renderMyOrders()">← 返回</button>
        <div class="card"><h3 style="color:var(--primary);">${o.project_name}</h3><p style="font-size:12px; color:#888;">${o.order_no} · ${o.status}</p></div>
        <div class="card"><h4 style="color:var(--primary); margin-bottom:8px;">🧵 流程</h4><div class="timeline">${tlHtml}</div></div>
        <div class="card">
            <h4 style="color:var(--primary); margin-bottom:8px;">💬 留言</h4>
            <div class="chat-box" id="chat-box">${chatHtml || '<div style="text-align:center; color:#aaa; font-size:12px;">暂无消息</div>'}</div>
            <div class="chat-input">
                <input id="msg-input" placeholder="输入留言...">
                <button class="btn btn-sm" style="margin:0;" onclick="sendMsg('${o.id}')">发送</button>
            </div>
        </div>
    `;
    const cb = document.getElementById('chat-box'); if(cb) cb.scrollTop = cb.scrollHeight;
}
async function sendMsg(orderId) {
    const input = document.getElementById('msg-input');
    if(!input.value.trim()) return;
    const role = state.isAdmin ? 'admin' : 'customer';
    await sb.from('messages').insert({ order_id: orderId, sender_role: role, content: input.value });
    input.value = '';
    openOrderDetail(orderId);
}

// 店长
function renderAdmin() {
    document.getElementById('apply-list').innerHTML = state.applications.filter(a=>a.status==='待审核').map(a => `
        <div class="card">
            <b>${a.applicant_name} (${a.contact})</b>
            <p style="font-size:13px; color:#555; margin:10px 0;">${a.description}</p>
            <button class="btn btn-sm" onclick="acceptApply('${a.id}', '${a.applicant_name}', '${a.contact}', '${a.user_id}')">接单</button>
        </div>
    `).join('') || '<p style="text-align:center; color:#aaa;">暂无</p>';
    
    document.getElementById('order-manage-list').innerHTML = state.orders.map(o => `
        <div class="card" onclick="openOrderDetail('${o.id}')">
            <b>${o.order_no} ${o.client_name}</b>
            <div style="font-size:12px; color:#888; margin-top:4px;">${o.project_name} · ${o.status}</div>
        </div>
    `).join('') || '<p style="text-align:center; color:#aaa;">暂无订单</p>';
}
function switchAdminTab(type) {
    document.querySelectorAll('.admin-tab div').forEach(d => d.classList.remove('active'));
    document.querySelectorAll('.admin-sec').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + type).classList.add('active');
    document.getElementById('admin-' + type).classList.add('active');
}
async function acceptApply(appId, name, contact, userId) {
    const orderNo = '#' + Math.floor(1000 + Math.random() * 9000);
    const { data: newOrder } = await sb.from('orders').insert([{ 
        order_no: orderNo, client_name: name, contact: contact, project_name: '新定制款', 
        status: '排队中', schedule_month: new Date().toISOString().slice(0,7), user_id: userId
    }]).select().single();
    await sb.from('order_nodes').insert(NODE_NAMES.map((n, i) => ({ order_id: newOrder.id, node_index: i, node_name: n, status: '待开始' })));
    await sb.from('applications').update({ status: '已接单' }).eq('id', appId);
    showToast('接单成功'); await loadData(); renderAdmin();
}

initAuth();
</script>
</body>
</html>
